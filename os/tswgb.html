# THE SUMMER WE FORGOT TO SAY GOODBYE
### A One-Shot Novel

---

## PROLOGUE
### The Girl Who Loved Ordinary Things

Mizuki Arai liked ordinary things.

She liked the sound of the vending machine outside her university building. She liked buying the same strawberry milk every Thursday, even though her friends kept telling her there were better flavours.

She liked rainy mornings, second-hand bookstores and the little bakery near the station that always ran out of melon bread before noon.

She liked knowing what tomorrow would look like.

Perhaps that was why she disliked surprises.

At twenty, Mizuki had a fairly ordinary life.

She attended university, occasionally complained about assignments, called her mother every Sunday and spent most evenings with her two closest friends, Emi and Rina.

She wasn't particularly interested in romance.

Not that she disliked it.

She simply didn't think about it very much.

Until the afternoon she met Takumi.

And, for a while, she began to believe that ordinary things could become extraordinary when shared with the right person.

She would eventually learn that the opposite was true, too.

That even the most beautiful memories could become difficult to remember.

---

## CHAPTER 1
### A Seat Beside the Window

It happened on a Tuesday.

Mizuki was late for her literature lecture.

Not terribly late, but late enough that most seats were occupied.

She entered quietly, whispered an apology to the professor and looked around.

There was one empty seat.

Beside a boy who was sleeping.

She hesitated.

Then she sat down.

A few minutes later, the professor asked everyone to open their textbooks.

The boy beside her didn't move.

Mizuki glanced at him.

His hair was slightly messy, and his cheek was pressed against his folded arm.

She nudged his notebook.

Nothing.

She nudged it again.

He opened one eye.

"You're drooling."

He immediately lifted his head.

"What?"

Mizuki pointed at his notebook.

He looked down.

There was no drool.

He looked at her.

She returned to her textbook.

"That's cruel."

"You were sleeping."

"I was thinking."

"With your eyes closed?"

"Very deeply."

Mizuki almost laughed.

Almost.

The boy stretched and sat properly.

"I'm Takumi, by the way."

"Mizuki."

"Nice to meet you."

"You were sleeping."

"You're going to remember that forever, aren't you?"

"Probably."

He smiled.

She didn't know it then, but she would eventually remember that particular smile more clearly than almost anything else about him.

---

## CHAPTER 2
### The Convenience Store

Their friendship developed without either of them noticing.

They began sitting together during lectures.

Then they started having lunch.

Eventually, Takumi began waiting for her outside the university building.

He had a habit of appearing without warning.

"Hey."

Mizuki looked up from her phone.

"You're late."

"By two minutes."

"Still late."

"You weren't waiting for me, were you?"

"No."

"Then why are you standing here?"

She looked away.

"Because the weather is nice."

Takumi glanced at the grey sky.

"Right."

He laughed.

They started visiting a convenience store after classes.

Takumi usually bought canned coffee. Mizuki bought strawberry milk.

Sometimes they shared snacks.

Sometimes they argued about music.

Once, they spent nearly forty minutes debating whether pineapple belonged on pizza.

Takumi believed it did.

Mizuki considered that a personal betrayal.

Their friendship became part of her routine.

And Mizuki, who liked ordinary things, found herself looking forward to them.

One evening, while they were walking toward the station, Takumi asked something unexpected.

"Do you think people meet for a reason?"

Mizuki adjusted her bag.

"Not really."

"Why?"

"Because people meet all the time. Most of them just pass by."

"That's depressing."

"It's realistic."

Takumi smiled.

"Then I'm glad I didn't pass by."

She didn't answer.

But she remembered it.

---

## CHAPTER 3
### The First Summer

Their relationship began in June.

There wasn't a dramatic confession.

No fireworks.

No perfectly timed rain.

They were sitting on the steps outside the university library when Takumi suddenly asked:

"Would you go out with me?"

Mizuki looked at him.

"Where?"

He stared.

"Are you serious?"

"You're being vague."

"I mean, as my girlfriend."

She looked down at her hands.

For a few seconds, she said nothing.

Then:

"Okay."

Takumi blinked.

"Okay?"

"Don't make me repeat it."

He smiled so widely that she had to look away.

Their first date was at a small aquarium.

Takumi spent too much time looking at the penguins.

Mizuki spent too much time looking at Takumi looking at the penguins.

Neither mentioned it.

They took photographs.

Ate overpriced food.

Missed their train because Takumi insisted on buying a souvenir.

It was a stupid little day.

Mizuki loved it.

After that, there were more days.

Days spent studying together.

Days spent walking home.

Days when Takumi called her because he couldn't sleep.

Days when she fell asleep during their conversations and woke up to messages telling her to get some rest.

She began keeping small things.

Cinema tickets.

Receipts.

Photographs.

A paper wrapper from the first chocolate he bought her.

Emi noticed.

"You're keeping rubbish now?"

"It's not rubbish."

"It's literally a receipt."

Mizuki put it back inside her notebook.

"Whatever."

Emi watched her for a moment.

Then smiled.

"You're really happy, aren't you?"

Mizuki didn't answer immediately.

"Yeah."

And she was.

For the first time, she had someone she wanted to tell everything to.

Even the things that didn't matter.

Especially those.

---

## CHAPTER 4
### Little Changes

The first change was his phone.

Takumi had always been careless with it.

He left it on tables, forgot it in classrooms and sometimes asked Mizuki to answer calls when his hands were occupied.

But somewhere around September, that changed.

He began keeping it face down.

He took calls outside.

Sometimes he smiled at messages and quickly put his phone away.

Mizuki noticed.

She didn't immediately suspect anything.

People were allowed to have private conversations.

Still, something felt different.

He also started cancelling plans.

"Sorry. Something came up."

"Again?"

"Just this once."

"You said that last week."

Takumi sighed.

"Mizuki, I'm busy."

She went quiet.

He noticed.

"Hey. Don't be like that."

"Like what?"

"Upset."

"I'm not."

He reached across the table and touched her hand.

"Let's go somewhere this weekend. I'll make it up to you."

She nodded.

And because she loved him, she believed him.

That weekend never happened.

Neither did the next one.

But there were still good moments.

That was the confusing part.

Takumi still kissed her forehead.

Still remembered her favourite drink.

Still complained when she walked too fast.

Sometimes he seemed exactly like the boy she had fallen in love with.

And Mizuki began convincing herself that perhaps relationships simply became quieter with time.

She didn't know that sometimes silence wasn't comfort.

Sometimes it was distance.

---

## CHAPTER 5
### October, 4:37 PM

Mizuki discovered the truth on an ordinary Thursday.

She had finished her classes early.

Takumi had told her he was attending a seminar, so she decided to visit the bookstore near the station.

She bought a novel, stopped at a café and spent twenty minutes deciding whether to get a second drink.

Then she saw him.

Across the street.

Takumi.

He was standing outside a small restaurant.

Mizuki almost called his name.

Then a girl approached him.

She was pretty.

She wore a cream-coloured cardigan and carried a small handbag.

Takumi smiled when he saw her.

Not the polite smile he gave strangers.

Not the tired smile he gave Mizuki when he was having a difficult day.

It was familiar.

Comfortable.

The girl reached for his hand.

He took it.

Mizuki stopped walking.

She watched them talk.

The girl said something that made him laugh.

Then she leaned against him.

Takumi kissed her.

Not accidentally.

Not as a misunderstanding.

It was the kind of kiss that belonged to two people who had done it before.

Mizuki stood across the street, holding a paper bag containing a book she suddenly couldn't remember buying.

A bicycle passed behind her.

Someone shouted into a phone.

The pedestrian signal changed.

People moved.

Mizuki didn't.

She checked her phone.

There was a message from Takumi.

*Sorry, the seminar is taking longer than expected. I'll call you tonight.*

She read it twice.

Then she looked up again.

He was still there.

Still smiling.

Still holding another girl's hand.

Mizuki walked away before they noticed her.

She didn't run.

She didn't cry.

She simply walked.

Past the bookstore.

Past the café.

Past the station.

She kept walking until she reached a small park she had never visited before.

She sat on a bench.

And for the first time in months, she didn't know what to do with her afternoon.

---

## CHAPTER 6
### The Question

Takumi called at 9:12 PM.

Mizuki answered.

"Hey."

"Hey. Sorry about today."

"It's okay."

"Did you eat?"

"Yeah."

"Good."

A pause.

Then he continued talking about his seminar.

Mizuki listened.

She listened to the person who had held her hand that morning, or at least who had promised to call her that evening.

She listened to him complain about his professor.

She listened to him laugh.

And she wondered how someone could sound so normal while carrying something so enormous between them.

"Takumi?"

"Hm?"

"Who was she?"

Silence.

"What?"

"The girl outside the restaurant."

Another silence.

Then:

"Where did you see me?"

"That doesn't matter."

"Mizuki—"

"Just answer."

He exhaled.

"She's someone I know."

Mizuki closed her eyes.

"Someone you kiss?"

He said nothing.

"Takumi?"

"I can explain."

She laughed.

It wasn't a happy sound.

"I know."

"Mizuki, listen—"

"No. I think I've heard enough."

She ended the call.

He called again.

She didn't answer.

Then came the messages.

*Please pick up.*

*It's not what you think.*

*Can we talk tomorrow?*

She placed her phone on the table.

For a long time, she stared at it.

Then she opened their conversation.

She scrolled upward.

June.

July.

August.

September.

Photographs.

Jokes.

Goodnight messages.

Promises.

She stopped at a message from their first month together.

*I don't think I'll ever get tired of you.*

Mizuki read it.

Then read it again.

She wondered whether he had meant it when he wrote it.

That was somehow worse than not knowing.

---

## CHAPTER 7
### Two People and a Table

They met the following afternoon.

Takumi chose the café.

The same one where they had celebrated their second month together.

Mizuki almost found that funny.

He arrived ten minutes late.

She was already sitting down.

"Hi."

"Hi."

He sat opposite her.

For a moment, neither spoke.

Then he rubbed the back of his neck.

"Her name is Natsuki."

Mizuki looked at him.

"Okay."

"We've known each other for a while."

"How long?"

"Before I met you."

"How long, Takumi?"

He looked down.

"A year."

She nodded slowly.

"And when did you start seeing her?"

He hesitated.

"Before we started dating."

Mizuki waited.

"Did you stop?"

He didn't answer.

She understood.

Her fingers tightened around the cup.

"So you were seeing both of us."

"It wasn't supposed to happen like this."

"How was it supposed to happen?"

"I was going to end things."

"With whom?"

Takumi looked at her.

"I didn't know."

Mizuki stared at him.

There it was.

Not an excuse.

Not even an explanation.

Just the truth, delivered without much courage.

"Did you love me?"

He looked genuinely hurt by the question.

"Of course I did."

"Did you love her?"

He lowered his eyes.

"I don't know."

Mizuki nodded.

She had spent the entire night imagining what she would say.

She had prepared questions.

Accusations.

Long speeches.

But now that she was sitting across from him, none of them seemed important.

There was only one thing she wanted to understand.

"Why?"

Takumi was quiet for a while.

Then he said:

"Because I liked being with you. You made everything easy. I didn't want to lose that."

Mizuki looked at him.

"And you didn't want to lose her either."

He said nothing.

She stood up.

"Mizuki, wait."

She picked up her bag.

"I hope you eventually understand what you did."

"I never wanted to hurt you."

She looked at him one last time.

"That's the problem, Takumi."

He frowned.

"You never wanted anything bad to happen to you. That's all."

Then she left.

She didn't look back.

---

## CHAPTER 8
### The Things That Remained

The following weeks were unpleasant.

Not dramatic.

Just unpleasant.

Mizuki stopped attending the convenience store after lectures.

She changed her usual route home.

She stopped listening to the playlist Takumi had made for her.

She deleted their photographs.

Or at least tried to.

She kept finding them.

A picture of his shoes beside hers.

A photograph of two cups of coffee.

His reflection in an aquarium window.

She couldn't bring herself to delete everything.

Emi eventually noticed.

"Have you eaten?"

Mizuki looked up.

"Yes."

"When?"

"Yesterday."

Emi stared at her.

"That's not funny."

"I wasn't joking."

Rina placed a sandwich on the table.

"Eat."

Mizuki looked at it.

Then at her friends.

"I don't feel hungry."

"That's unfortunate," Emi replied. "Because I bought it."

Mizuki smiled faintly.

She took a bite.

It was an ordinary afternoon.

And somehow, that helped.

There were difficult days.

Days when she missed him.

Days when she wondered whether she had been insufficient.

Days when she saw couples walking together and remembered the way Takumi used to hold her hand.

She hated those moments.

She hated that someone could hurt her and still occupy so much space in her mind.

One evening, she opened their old conversation.

She typed:

*I hope you're happy.*

She stared at the sentence.

Then deleted it.

She didn't want to give him another message.

Not because she wanted him to suffer.

But because she was tired of making her feelings his responsibility.

That night, she slept without checking her phone.

It was a small thing.

But it was hers.

---

## CHAPTER 9
### Natsuki

Mizuki met Natsuki three weeks later.

It happened outside the university library.

Mizuki recognised her immediately.

The cream cardigan.

The same handbag.

Natsuki approached her cautiously.

"Are you Mizuki?"

Mizuki stopped.

"Yes."

"I'm Natsuki."

"I know."

Natsuki looked uncomfortable.

"Can we talk?"

Mizuki considered leaving.

But she stayed.

They sat on a bench.

For a while, Natsuki looked at her hands.

Then she spoke.

"I didn't know he was dating you."

Mizuki looked at her.

"How long have you been together?"

Natsuki swallowed.

"Since last year. We were having problems, but I thought we were still together."

Mizuki looked toward the library entrance.

The information didn't make her feel better.

It didn't make her feel worse either.

It simply added another piece to a picture she hadn't wanted to see.

"Did he tell you about me?"

"No."

Mizuki nodded.

Natsuki's eyes became watery.

"I'm sorry."

Mizuki didn't immediately respond.

She wanted to say something cruel.

Something that would make the girl feel as uncomfortable as she did.

But she couldn't find a reason to.

Natsuki hadn't been the person who promised her anything.

"Did you know he was seeing someone else?" Mizuki asked.

"No."

"Then I guess we both believed him."

Natsuki looked at her.

"Are you going to forgive him?"

Mizuki almost laughed.

"I haven't even figured out what to do with what happened."

They sat quietly.

Before leaving, Natsuki said something.

"I hope you find someone better."

Mizuki adjusted her bag.

"I hope you find someone honest."

They walked in opposite directions.

And Mizuki realised something.

She didn't hate Natsuki.

She didn't particularly like her either.

She simply wished they had never needed to meet.

---

## CHAPTER 10
### Winter Doesn't Wait

December arrived.

The trees outside the university library lost their leaves.

Exams approached.

Emi complained about her assignments.

Rina started dating someone from her department.

Life continued with an almost offensive amount of normality.

Mizuki began visiting the bakery again.

She bought strawberry milk on Thursdays.

She started reading before bed.

Sometimes she laughed at things without remembering that she had once been unhappy.

And sometimes she remembered.

Healing wasn't a straight line.

It was more like walking through a familiar neighbourhood after someone had moved away.

You knew the streets.

You knew where everything was.

But certain places looked different.

One evening, Takumi sent her a message.

*Can we talk?*

She looked at it for several seconds.

Then another message appeared.

*I miss you.*

Mizuki placed her phone beside her textbook.

She didn't feel angry.

She didn't feel excited.

She felt tired.

She opened the conversation.

Typed something.

Deleted it.

Then finally wrote:

*I hope you're doing well. But I don't think we should talk anymore.*

She sent it.

He didn't reply immediately.

A few minutes later, he wrote:

*Okay. Take care of yourself.*

Mizuki read it.

Then closed the conversation.

It wasn't the apology she had once wanted.

It wasn't the explanation she had spent nights imagining.

But it was an ending.

And sometimes, an ending was simply a door that stopped opening.

---

## CHAPTER 11
### The Last Photograph

In February, Mizuki found something inside her desk.

A photograph.

It was from their aquarium date.

Takumi stood beside the penguin enclosure, looking at something outside the frame.

Mizuki was laughing.

She didn't remember what had been said.

She only remembered being happy.

She sat on the floor for a while, holding the photograph.

There was something strange about seeing herself that way.

She looked so certain.

So comfortable.

So completely unaware of what was coming.

For a moment, she wanted to tell that version of herself everything.

To warn her.

To tell her not to trust him.

To tell her that the boy beside her would eventually become someone she wouldn't recognise.

But then she stopped.

Because that girl had done nothing wrong.

She had loved someone.

She had believed him.

She had been happy.

There was no reason to punish her for that.

Mizuki placed the photograph inside a small box.

She didn't throw it away.

Some memories deserved to exist, even when they hurt.

She closed the lid.

And moved the box to the back of her shelf.

---

## EPILOGUE
### The Next Summer

It was June again.

Exactly one year since Mizuki had met Takumi.

The university was preparing for its annual summer festival.

Emi was busy organising a music event.

Rina was arguing with someone about decorations.

Mizuki had volunteered to help at a small book exhibition.

She was arranging books when a familiar voice spoke behind her.

"Excuse me."

She turned.

A boy stood there holding a box.

He had short black hair, a slightly nervous expression and a university volunteer badge.

"Where should I put these?"

Mizuki pointed toward the empty table.

"Over there, please."

"Thanks."

He placed the box down.

Then looked at the books.

"Do you like reading?"

Mizuki glanced at him.

"Sometimes."

"That's a very unconvincing answer."

She smiled.

"Do you always ask strangers questions?"

"Only when I'm carrying heavy boxes."

She laughed.

It surprised her.

Not because it was particularly funny.

But because she hadn't realised how long it had been since she had laughed at a stranger's stupid joke.

The boy introduced himself as Haruto.

They spent the next hour arranging books.

They talked about ordinary things.

Favourite authors.

Bad cafeteria food.

The inconvenience of university schedules.

Nothing important.

Before leaving, Haruto looked at the book in her hand.

"Have you read that one?"

"No."

"Is it good?"

"I don't know."

"Then why are you holding it?"

Mizuki looked at the cover.

"Maybe I want to find out."

He smiled.

"Fair enough."

He returned to his work.

Mizuki watched him for a moment before looking down at the book again.

She didn't feel anything extraordinary.

There was no sudden warmth.

No racing heartbeat.

No imaginary future.

Just a pleasant conversation on a summer afternoon.

And she liked that.

Later that evening, she walked home alone.

The sky was turning orange.

She stopped near the station and looked at the sunset.

A year ago, she would have taken a photograph and sent it to Takumi.

Now she simply watched.

Her phone vibrated.

A message from Emi.

*Are you coming tomorrow? Haruto asked if you'd help with the exhibition again.*

Mizuki smiled.

She typed:

*Sure. I'll be there.*

Then she put her phone away.

She had once believed that loving someone meant giving them a place in every part of her life.

Now she understood that some places could remain hers.

The sky grew darker.

The station lights came on.

And somewhere behind her, the city continued moving.

Mizuki started walking.

She didn't know what the next summer would bring.

For once, she didn't feel the need to know.

---

### ONE YEAR LATER

**A message appeared on Mizuki's university email account.**

The sender was someone she didn't recognise.

The subject line read:

*Regarding the summer festival.*

She almost deleted it.

Then she noticed the attachment.

A photograph.

It showed the university festival from the previous year.

Mizuki recognised the location immediately.

The book exhibition.

The same afternoon she had met Haruto.

But there was something she hadn't noticed before.

In the background, standing near the entrance, was Takumi.

And beside him was Natsuki.

The photograph had been taken months after Mizuki had ended their relationship.

She stared at it.

Then opened the email.

There were only two sentences.

*I think you deserve to know why Takumi came looking for you that afternoon.*

*My name is Shiori. We need to talk.*

Mizuki read the message twice.

Outside her window, summer rain began falling.

She slowly closed her laptop.

For a moment, she considered replying.

Then she looked at the photograph of the sunset pinned beside her desk.

She had spent an entire year learning how to leave the past where it belonged.

But perhaps the past hadn't finished with her.

Mizuki opened her laptop again.

And typed:

*Who are you?*

**END.**
