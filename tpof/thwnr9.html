Yuzuna was at Tsubaki Books when the message arrived.
She looked at the screen.
Then locked it.
Then unlocked it again.
Kaito watched from the opposite side of the table.
"Are you going to read it?"
"No."
"Why?"
"Because I'm seventeen again."
He blinked.
"You're twenty-two."
"Thank you, Kaito. I'd forgotten."
He leaned back.
Yuzuna looked at the phone.
Then opened the message.
It contained only three lines.
~I remember that day.
~I'm sorry I didn't come outside.
~Would you like to meet?
Yuzuna covered her mouth.
Kaito looked away.
He didn't want to watch her cry again.
Not because it was unpleasant.
Because he didn't know how to help, and that made him feel useless.
Yuzuna wiped her eyes.
"She wants to meet."
Kaito nodded.
"Good."
She stared at the message.
"I don't know what to do."
"Neither does she, probably."
Yuzuna laughed.
Then she typed:
>Yes. If you're sure.
Saki replied:
~Saturday? After the shop closes?
Yuzuna smiled through her tears.
>Saturday.
She pressed send.
Then placed the phone on the table.
For several seconds, neither sibling spoke.
Finally, Yuzuna looked at Kaito.
"Hey."
"What?"
"Thank you."
He shrugged.
"Don't make it weird."
She smiled.
"You're the worst."
"I know."
She reached across the table and squeezed his hand.
He didn't pull away.
Saturday arrived too quickly.
Yuzuna reached Tsubaki Books at 4:00 PM.
The meeting wasn't until six.
She spent the first hour pretending to browse the shelves.
The second hour was spent reorganizing a display that didn't need reorganizing.
By 5:30, Mrs. Takeda had threatened to charge her for damages if she moved one more book.
Kaito arrived at 5:42.
He found his sister standing near the window, holding a paper cup of tea she hadn't touched.
"You're early."
"You're late."
"It's five forty-two."
"I've been here for two hours."
"That's a personal problem."
She glared at him.
He grinned.
Then looked at the cup.
"Are you going to drink that?"
"No."
"Can I have it?"
"Absolutely not."
He took it anyway.
She smacked his arm.
For a moment, they were twelve and seventeen again.
Then the bell rang.
Saki entered.
She was carrying a small bouquet of yellow freesias.
Yuzuna went still.
Saki stopped near the door.
Neither moved.
Kaito slowly placed the tea on the counter.
Then looked at Ayane.
Ayane looked at him.
They both understood.
This wasn't their moment.
They gathered the notebooks and stepped into the back room with Mrs. Takeda, leaving the front of the shop to the two women who had spent five years trying to understand a day neither had properly seen.
Through the glass partition, Ayane watched them sit across from each other.
Yuzuna kept her hands folded on the table.
Saki placed the flowers between them.
Neither spoke for a while.
Then Yuzuna laughed nervously.
Saki laughed too.
The tension loosened.
Not enough to disappear.
But enough for words to begin.
Later, Yuzuna told Kaito what they had said.
They talked about the day.
About the rain.
About the messages.
About the things they'd both believed.
Yuzuna had thought Saki was angry enough to refuse to see her.
Saki had thought Yuzuna had decided to leave without saying goodbye.
Both had been waiting.
Both had been hurt.
And neither had known.
"I told her I should have gone inside," Yuzuna said.
They were sitting on the bench outside Tsubaki Books.
Kaito was eating a packet of biscuits.
"She told me she should have come outside."
Kaito swallowed.
"Sounds like you both need better communication skills."
She hit him.
He laughed.
Then Yuzuna looked at the flowers Saki had left behind.
"She remembered."
"Remembered what?"
"That I like freesias."
Kaito smiled.
"That's good."
Yuzuna nodded.
Then her expression changed.
"Do you think we'll be friends again?"
Kaito thought about it.
"I don't know."
She looked at him.
He shrugged.
"You both changed. You might not like the same things anymore. You might argue about something stupid and realize you don't have as much in common as you used to."
Yuzuna stared at him.
"You're terrible at comforting people."
"I'm being honest."
She sighed.
Then nodded.
"That's fair."
He looked at her.
"But you can still get to know each other again."
Yuzuna went quiet.
Then smiled.
"You're getting better at this."
"Don't get used to it."
She laughed.
And for a while, they sat together in the evening air.
No grand promises.
No perfect reconciliation.
Just a brother and sister who had finally started speaking honestly.
Two weeks later, Ayane returned to Tsubaki Books after school.
The book was no longer beneath the counter.
Mrs. Takeda had placed it on a small display near the entrance, alongside a handwritten sign.
!BOOKS WITH STORIES OF THEIR OWN.
Ayane stopped.
"Mrs. Takeda."
The older woman looked up.
"What?"
"You're displaying it?"
"Yes."
"Why?"
"Because people keep asking about it."
"Who?"
"People."
Ayane narrowed her eyes.
Mrs. Takeda smiled.
Then Ayane noticed something beside the book.
A small envelope.
Kaito's handwriting was on the front.
!For the book.
She picked it up.
Inside was a single sheet of paper.
Two paragraphs.
One in Yuzuna's handwriting.
One in Saki's.
They weren't arguing about the novel anymore.
They were writing about themselves.
Yuzuna had written:
!I waited outside because I was scared to go in.
Saki had written:
!I stayed inside because I was scared to come out.
Below that, in smaller letters, both had signed their names.
Ayane held the paper carefully.
"Did they write this together?"
Mrs. Takeda nodded.
"They came by yesterday."
Ayane smiled.
Then looked at the old book.
"Should we put it inside?"
"No," Mrs. Takeda said. "We'll keep it beside the book."
"Why?"
"So people can read it without opening the book."
Ayane understood.
The messages in the margins had been hidden for years.
They had been meant for one person, or perhaps no one in particular.
But the letter was different.
It was direct.
It had names.
It belonged in the open.
Ayane placed the envelope beside the paperback.
Then stepped back.
The display looked ordinary.
A few old books.
A handwritten sign.
A small envelope.
Nothing special.
But for some reason, she felt proud.
Not because she'd solved the mystery.
She hadn't.
There were still messages she couldn't identify. There were still dates that didn't make sense. There were still things about the past that belonged to other people.
She was proud because she'd learned when to stop asking questions.
And when to let someone answer in their own time.
That evening, Kaito walked her to the station.
It had rained earlier, and the pavement reflected the shop lights.
Ayane carried her bag on one shoulder.
Kaito carried the book's old receipt, which Yuzuna had given him after their meeting.
Neither spoke for a while.
Then he said, "Can I ask you something?"
Ayane looked at him.
"Depends."
"Why did you get involved in this?"
She thought about it.
"I don't know."
"That's your favorite answer lately."
"It's an honest one."
He nodded.
She watched the lights change at the crossing.
"Maybe I wanted to know whether the people who wrote those messages ever found each other."
Kaito was quiet.
"And now?"
"Now I think they did."
He smiled.
They crossed the street.
A few steps later, he stopped.
Ayane turned.
"What?"
He rubbed the back of his neck.
It was the first time she'd seen him look genuinely nervous.
"I like spending time with you."
She blinked.
He stared at the pavement.
"I know we spend a lot of time arguing, and you think my sandwiches are terrible, and I probably annoy you more than anyone else in your life."
"That's true."
He looked up.
"Could you let me finish?"
"Sorry."
He took a breath.
"I like you, Sato."
The words were quiet.
Not dramatic.
Not rehearsed.
He looked as if he'd been trying to say them for days and had only just realized there wasn't a better way.
Ayane stared at him.
Her mind went completely blank.
Which was unfortunate, because she'd spent seventeen years preparing for conversations she never had.
"You're supposed to say something," he muttered.
"I know."
"Anything would be good."
"I'm thinking."
"Please don't make a list."
"I wasn't going to make a list."
He gave her a look.
She sighed.
Then looked down.
"I like you too."
Kaito went still.
She immediately panicked.
"Not because of the mystery. I mean, you're annoying, and you make terrible food, and sometimes you say things that make no sense—"
"You're doing great."
"Shut up."
He laughed.
She looked at him.
"I don't know what happens now."
He considered that.
"Neither do I."
"That's not very reassuring."
"Would you prefer a five-year plan?"
"No."
"Excellent. I don't have one."
Ayane laughed.
Then she took a breath.
"We could go somewhere together. Not because we have to call it a date immediately. Just… somewhere."
Kaito smiled.
"That sounds good."
"Saturday?"
"Saturday."
"And no tuna sandwiches."
"You're ruining the romance."
"There was romance?"
He put a hand over his heart.
"You're cruel."
She smiled.
Then, before she could change her mind, she reached for his hand.
He looked down at their fingers.
Then at her.
Neither said anything.
They crossed the next street holding hands.
It wasn't the beginning of forever.
It wasn't even a promise.
It was just two seventeen-year-olds trying something new, with absolutely no idea what they were doing.
Ayane thought that was probably enough.
For now.`;
