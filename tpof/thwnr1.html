var T=`At 4:37 PM, Ayane Sato discovered that someone had shelved a book upside down.
She stared at it.
Then at the shelf.
Then at the book again, as though the book might feel embarrassed and correct itself.
It didn't.
"Who does this?"
Mrs. Takeda, the bookstore's owner, didn't look up from her packet of crackers.
"Someone who doesn't get paid enough to care."
"I don't get paid enough to care either."
"Then you should have left it upside down."
Ayane pulled the book out, turned it around, and slid it back into place.
"There. Now it looks like a bookstore."
"It looked like a bookstore before."
"It looked like a crime scene."
Mrs. Takeda crunched another cracker.
"You're seventeen. How do you already sound like someone's disappointed mother?"
Ayane ignored her.
She was good at ignoring people. Not because she was particularly mature or emotionally intelligent, as her literature teacher had suggested during a parent meeting.
She just needed a little longer than other people to think of something worth saying.
Unfortunately, by the time she thought of something, the conversation was usually over.
So she'd developed a system.
Say little. Observe everything. Never let anyone rearrange the shelves.
The third rule was the most important.
Outside, the rain had started again.
It wasn't particularly heavy, but the pavement was wet enough to make passing bicycles hiss. Across the narrow street, the flower shop owner was bringing her potted plants inside. The little café next door had switched on its lights, turning the windows a warm yellow.
Ayane glanced through the glass.
A couple sat at the corner table.
The boy was attempting to steal a piece of food from the girl's plate.
She slapped his hand away without looking up from her sketchbook.
He tried again.
She stabbed his fingers with a fork.
He immediately withdrew.
Ayane looked away.
"Disgusting."
Mrs. Takeda swallowed a cracker.
"What is?"
"Nothing."
"You're staring at the café again."
"I'm checking the weather."
"Through a wall?"
Ayane returned to her books.
She wasn't staring at the café.
And even if she was, it wasn't because of the couple.
She simply found it irritating that some people could sit in a public place and behave as if the rest of the world didn't exist. They could steal food from each other's plates, argue over something stupid, and occupy the same corner table every week without appearing remotely embarrassed about it.
Must be nice.
Not that she wanted it.
She had other things to worry about.
Like the stack of donated books beside her.
And the fact that she'd accidentally agreed to work on Saturday.
And the message her classmate had sent twenty minutes ago.
~Hey, are you coming tomorrow? Everyone's going.
She'd read it six times.
She still hadn't replied.
Tomorrow was a class gathering at an amusement park. She had already decided not to go, but saying no felt unnecessarily cruel, so she'd been considering sending a thumbs-up emoji and hoping the conversation somehow resolved itself.
Her phone vibrated.
Another message.
~Ayane?
She turned it face down.
"Very healthy," Mrs. Takeda remarked.
"You're not helping."
"I wasn't trying to."
The bell above the bookstore door rang.
Someone entered, bringing a gust of cold air and several raindrops onto the wooden floor.
Ayane immediately reached for the cleaning cloth.
"Umbrella."
The newcomer looked at her.
"Huh?"
"You're dripping."
He looked down at his shoes.
Then at his jacket.
Then back at her.
"Oh."
He stepped outside again and shook his umbrella over the pavement.
"Outside," Ayane reminded him.
"I am outside."
"You're half inside."
He stepped farther out.
"Here?"
"Yes."
He shook the umbrella.
Water landed on the pavement.
"Good?"
"Acceptable."
He gave her a strange look before folding the umbrella and entering properly.
He was a student, probably around her age, wearing the uniform of the high school across town. His tie was crooked, his bag hung from one shoulder, and his dark hair looked as though he'd attempted to fix it with his fingers and eventually given up.
He had a paper bag tucked under his arm.
Ayane pointed at the entrance.
"Umbrella stand."
He looked at the stand.
Then at his umbrella.
Then at her.
"You know, most shops have a sign."
"Most people know what an umbrella stand is."
"Fair point."
He put the umbrella away.
Ayane returned to her books, satisfied.
Problem solved.
Then the boy walked directly past the counter, stopped in front of the shelves, and began examining the books.
She watched him from the corner of her eye.
He picked up a novel.
Opened it.
Read the first few pages.
Put it back.
Picked up another.
Read the back cover.
Put that back too.
After five minutes, he hadn't purchased anything.
Ayane was beginning to wonder whether he was a thief with an unusually specific browsing routine.
Then he approached the counter.
"Excuse me."
She looked up.
"Yes?"
"Do you have somewhere I can put this?"
He placed the paper bag on the counter.
Ayane looked at it.
"What is it?"
"A book."
"I can see that."
"Then we're making progress."
She stared at him.
He stared back.
For one terrible second, she considered telling him to leave.
Instead, she opened the paper bag.
Inside was a battered paperback with a faded blue cover.
There was no price sticker.
The corners were bent, the spine had begun to split, and a pale stain marked the bottom edge of the back cover. Someone had written a number in pencil on the inside flap, then crossed it out so many times that the paper had nearly torn.
Ayane lifted it carefully.
"Where did you get this?"
"Here."
She looked up.
"What?"
"I bought it here."
"When?"
"Last week."
"That's impossible."
He tilted his head.
"I've been told that before."
"We don't sell books without price stickers."
"Well, apparently you do."
"No, we don't."
"Okay."
He said it so casually that Ayane immediately suspected he was lying.
She turned the book over.
The title was printed in small, faded letters.
*The House at the End of June.
She had never heard of it.
"Why are you bringing it back?"
"Because there's something inside."
"An insect?"
"No."
"Money?"
"No."
"Then what?"
He opened the book to a page near the middle and placed it in front of her.
"That."
Ayane leaned over the counter.
At first, she saw nothing unusual.
Just a paragraph of printed text.
Then she noticed the handwriting in the margin.
Someone had written a sentence in blue ink.
!The ending was unfair.
Below it, in a different hand, someone had replied in pencil.
!The ending was honest.
Ayane turned the page.
Another note.
!Honest doesn't mean good.
On the next page:
!Neither does happy.
She flipped farther.
There were more messages scattered throughout the book. Some were written in neat handwriting, others hurriedly, as though their authors had been trying to write without being caught.
The messages didn't appear random.
They argued with each other.
They disagreed about the characters, complained about the plot, and occasionally insulted the author.
One person had written, _He should have apologized._
Someone else had answered, _For what? Being human?_
A third person had added beneath it:
!Both of you need hobbies.
Ayane almost smiled.
Almost.
She kept turning the pages.
"How many people wrote these?"
"That's what I'm trying to figure out."
"Why?"
"Because the handwriting changes."
He leaned over the counter and pointed to the margins.
"Look. This one's blue ink. This one's pencil. That one looks like it was written with a mechanical pencil, and that one—"
"You're leaning on the book."
He immediately straightened.
"Sorry."
Ayane examined the notes more closely.
He was right.
The handwriting changed from page to page, sometimes within the same conversation. There were different pens, different writing styles, even different levels of pressure against the paper.
Some notes were faded almost beyond recognition.
Others looked relatively recent.
She found a date written beside a sentence near the bottom of one page.
#June 22, 2021.
Below it, in another handwriting, someone had replied in cramped letters.
!I waited until the shop closed.
Ayane turned the page.
A few lines farther down, another message caught her attention.
!If you're reading this, I'm sorry I never came back.
She read it twice.
Then she turned the page again.
The following sheet contained only a small drawing of a door.
Beneath it was a sentence in dark green ink.
!I'm here. You can come out now.
Ayane's fingers stopped.
She looked at the boy.
He was watching her now, his earlier amusement gone.
"See?" he said quietly.
She looked back at the page.
"These could be from different people who have nothing to do with one another."
"Could be."
"People sometimes write in books."
"Sure."
"Some of them are probably just bored."
"Definitely."
She frowned.
"You're being annoyingly reasonable."
"Sorry. I'll start shouting about conspiracies."
She ignored him.
The receipt tucked into the back of the book was old, its edges yellowed. Most of the printed text had faded, but the shop's name remained visible at the top.
#Tsubaki Books.
Below it was the same date.
#June 22, 2021.
Someone had written on the back of the receipt.
!I'm here. You can come out now.
The same sentence as the one in the book.
Ayane looked at the boy.
"Why did you buy this?"
He rubbed the back of his neck.
"Because I thought it was interesting."
"That's not a reason to spend three hundred yen."
"Have you seen the price of convenience-store pudding lately?"
"What does pudding have to do with anything?"
"Nothing. I just wanted pudding."
She stared at him for another moment.
Then she laughed.
It escaped before she could stop it.
Just one short laugh, barely more than a breath.
The boy looked so surprised that she immediately regretted it.
"Don't."
"I didn't say anything."
"Your face did."
"My face is innocent."
"Your face looks stupid."
He pressed a hand to his chest.
"That's a terrible thing to say to a customer."
"You're not a customer anymore."
"What am I?"
"An inconvenience."
He considered this.
"That's fair."
Mrs. Takeda appeared beside them, holding a cardboard box.
"What have you two broken?"
"Nothing," Ayane said.
"Nothing," the boy echoed.
The old woman looked from one to the other.
Then at the book.
She stopped.
For the first time since the boy had entered, she wasn't smiling.
"Where did you get that?"
The boy sat up.
"From here. Last week."
Mrs. Takeda took the book.
She turned it over slowly, her thumb brushing the faded blue cover.
Ayane had worked at Tsubaki Books for nearly a year. She had seen the owner become annoyed over misplaced invoices, damaged deliveries, missing keys, and once, a customer who'd used a perfectly good bookmark to scrape chewing gum off his shoe.
She had never seen her look at a book like this.
"Mrs. Takeda?"
The old woman didn't answer.
She opened the book to the page with the receipt.
For a moment, her expression became difficult to read.
Then she folded the receipt along its original crease and slipped it back into the book.
"Don't throw this away," she said.
"I wasn't planning to," the boy replied.
"And don't write in it."
He held up both hands.
"I didn't."
Mrs. Takeda looked at him.
He lowered them.
"Okay. That sounded suspicious, but I really didn't."
She ignored him.
Ayane moved closer to the counter.
"You know something about it."
It wasn't a question.
Mrs. Takeda closed the book.
"Many books come through this shop."
"That's not an answer."
"No," the owner agreed. "It isn't."
"Then—"
"Ayane."
The older woman rarely used her name like that.
Ayane stopped.
Mrs. Takeda placed the paperback on the counter, away from the other books.
"Some things aren't mysteries just because nobody has explained them to you."
Ayane disliked that sentence immediately.
It sounded like something teachers said when they didn't know the answer themselves.
"Then what are they?"
Mrs. Takeda glanced toward the rain-streaked window.
"I don't know."
That answer was worse.
Because it sounded honest.
The boy stood and picked up his umbrella.
"So, should I leave?"
"Probably," Ayane said.
"Right."
He started toward the door.
Then turned back.
"Hey, Sato?"
She looked up sharply.
"How do you know my name?"
He pointed toward the small name tag pinned to her cardigan.
"Oh. Right."
For someone who had spent an entire afternoon examining a book for clues, he could be remarkably stupid.
He opened the door.
"See you around."
"Don't leave your umbrella dripping everywhere next time."
"I'll consider it."
"And don't call me Sato like we're friends."
He paused.
"What should I call you, then?"
"Nothing."
He grinned.
"Got it, Nothing."
Before she could throw the cleaning cloth at him, he disappeared into the rain.
The bell above the door rang once.
Then the shop was quiet again.
Ayane stood behind the counter, staring at the empty doorway.
She should have been relieved.
Instead, she found herself looking at the book.
The faded blue cover.
The damaged spine.
The receipt hidden behind the last page.
!I'm here. You can come out now.
She thought about the date.
June 22, 2021.
Five years ago.
She tried to picture the person who'd written it.
Were they young? Old? Did they live nearby? Had they stood outside this same bookstore, getting impatient in the rain, checking their phone every few minutes?
Had someone actually come out?
Or had they waited alone until closing time?
Ayane hated questions she couldn't answer.
She hated them even more when they had nothing to do with her.
She reached for the book and slipped it beneath the counter, away from the shelves.
Then she took out her phone.
The unanswered message from her classmate was still there.
~Ayane?
She typed:
>Sorry. I'm not coming tomorrow.
She stared at the message.
Then added:
>Have fun, though.
She pressed send before she could reconsider.
It wasn't a particularly brave thing to do.
But when the reply arrived almost immediately—
~Okay!! I'll tell you everything afterward lol.
—Ayane felt a little lighter.
She put her phone away.
At 6:15 PM, she locked the front door.
She stood beneath the awning for a moment, watching the rain run along the edge of the pavement.
Then she looked back through the glass.
The book was still beneath the counter.
Waiting, apparently.
Ayane sighed.
"You're just a book," she muttered.
The book offered no objection.
She went home.
But that night, at 11:42 PM, she found herself searching for _The House at the End of June_ on the internet.
There were no recent reviews.
No official website.
No discussion forums worth reading.
The book had been published twenty-three years ago by a small company that no longer existed.
Its author had written three other novels.
None had sold particularly well.
Ayane scrolled through the available information until she found a photograph of the original cover.
It was different from the copy she'd seen that afternoon.
The original had a pale blue door on the front.
And beneath the title was a line of text.
*For the people who almost made it home.
Ayane read it twice.
Then closed the browser.
"Stupid book."
She rolled over and pulled her blanket up to her chin.
Tomorrow, she'd return it to the shelf.
She wouldn't investigate the receipt.
She wouldn't ask Mrs. Takeda any more questions.
And she certainly wouldn't think about the boy with the irritating face.
She closed her eyes.
Five minutes passed.
Then she reached for her phone again.
She opened her notes application and typed four questions.
#1. Who wrote the receipt?
#2. Who was supposed to come out?
#3. Why did Mrs. Takeda look like she'd seen a ghost?
#4. Why did that stupid boy buy the book in the first place?
She stared at the fourth question for a long time.
Then closed the application.
Outside, the rain continued until well past midnight.
And somewhere in the quiet neighborhood, beneath the sign of a secondhand bookstore, a small blue paperback sat in the dark.
Its final page remained closed.
For now.`;
