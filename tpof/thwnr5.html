var T=`Kaito arrived at Tsubaki Books at 4:19 PM.
Ayane was already waiting.
He knew something was wrong because she had arranged three notebooks, two pencils, and the faded blue paperback in a perfectly straight line across the counter.
She only arranged things that carefully when she was upset.
"What's happened?"
She looked up.
"Nothing."
He glanced at the notebooks.
"Right. And I suppose you've organized them for fun."
"Sit down."
He sat.
Ayane showed him the photograph of the bookstore.
Then she explained what Mrs. Takeda had told her.
The two girls.
The one inside.
The one outside.
The rain.
The missed meeting.
Kaito listened without interrupting.
When she finished, he looked at the photograph.
"That's my sister."
Ayane blinked.
"You're sure?"
"I think so."
He leaned closer.
"The umbrella. She used to carry one with a wooden handle. She broke it when I was little because I accidentally sat on it."
He smiled faintly.
"I cried more than she did."
Ayane studied the image.
The person outside had a dark umbrella.
"Then the other girl must be—"
"Mio."
Kaito said the name so suddenly that Ayane stopped.
He looked surprised himself.
"Sorry. I don't know why I said that."
"Your sister's friend?"
"I remember the name from a notebook. Yuzuna used to mention someone called Mio."
Ayane opened her notebook.
"Mio."
She wrote it down.
Then put her pen away.
"Before we do anything else, I need to tell you something."
Kaito looked wary.
"That sounds expensive."
"I'm serious."
"Okay."
She hesitated.
"I think your sister wrote some of these messages. But that doesn't mean we should contact her without asking you first."
He stared at her.
"You've been doing a lot of things without asking lately."
Ayane stiffened.
"What?"
"You looked at the book. You photographed the picture. You made lists. You spoke to Mrs. Takeda. You asked about my sister."
"I didn't force anyone to answer."
"I know."
"Then what's the problem?"
Kaito rubbed a hand across his face.
"The problem is that this is my family, and I haven't even figured out what I want to do about it."
Ayane went quiet.
He looked at her.
"I'm not saying you did anything wrong. I just—"
He stopped.
Then laughed once, without humor.
"I don't know. I thought I'd have more time before this became real."
Ayane looked at the book.
For once, she didn't have an answer.
Kaito took a breath.
"My sister left home when I was twelve. Not in a dramatic way. She went to college, got a place with some friends, and started building her life somewhere else."
He shrugged.
"That was the normal thing to do."
"Then why are you upset?"
The question came out before Ayane could stop it.
Kaito looked at her.
She immediately regretted asking.
"Sorry."
"No. It's fine."
He looked down at his hands.
"Because we fought before she left."
Ayane waited.
"I told her she was always leaving things behind. Clothes. Books. Promises. I told her she was selfish for expecting me to miss her when she couldn't even remember to call."
He rubbed his thumb across his knuckle.
"She said she wasn't asking me to miss her. She was asking me to stop making her feel guilty for growing up."
Ayane didn't move.
"I told her I didn't care if she left."
He laughed quietly.
"She left."
The shop was silent.
Kaito stared at the book.
"She called me the next week. I didn't answer. Then she sent a message. I replied with one word. After that, we just… stopped trying very hard."
Ayane felt something twist in her chest.
"Have you ever apologized?"
"No."
"Why?"
He glanced up.
"Because she should apologize too."
The answer came too quickly.
They both knew it.
Kaito looked away.
"Yeah. I know."
Ayane sat down opposite him.
She didn't tell him that he was wrong.
She didn't tell him that his sister probably missed him.
She didn't try to turn the moment into something neat.
Instead, she said, "You don't have to decide today."
He looked at her.
"You're stealing my lines now."
"You were right the first time."
He smiled a little.
Then looked at the book again.
"I want to call her."
Ayane nodded.
"Okay."
"But not today."
"Okay."
"And don't write that down."
She closed her notebook.
"I wasn't going to."
He stared at her.
She sighed.
"Fine. I was going to write it down."
He laughed.
It was a small laugh, but some of the tension left his shoulders.
They put the book away.
For the rest of the afternoon, they talked about ordinary things.
A teacher who had apparently confused two students' names for three weeks.
A vending machine that had stolen Kaito's money.
A girl in Ayane's class who had started wearing sunglasses indoors after an unfortunate eyebrow incident.
It was pleasant.
And for some reason, that made the subject of his sister feel less frightening.
That evening, Kaito took the book from the box beneath his bed.
He sat at his desk and opened it to the inside cover.
His sister's name stared back at him.
!Yuzuna Moriyama.
He opened his phone.
For a long time, he did nothing.
Then he typed:
>Hey. Do you remember a book called The House at the End of June?
He stared at the sentence.
Added another line.
>I found a copy.
He almost sent it.
Then he imagined her reading the message and wondering why he was asking.
He imagined her replying politely.
He imagined the conversation ending before it began.
His thumb hovered over the screen.
Finally, he added:
>I think it might be yours.
He pressed send.
The message turned blue.
Delivered.
Kaito placed the phone facedown.
Then he stood up and went to the kitchen.
His mother was making dinner.
"Can you set the table?" she asked.
"Sure."
He took out three plates.
Stopped.
Put one back.
Then took it out again.
His mother watched him.
"Everything okay?"
"Yeah."
She looked at him for another moment.
"Did you talk to your sister?"
He froze.
"What?"
"She messaged me earlier. She said you'd contacted her."
Kaito looked away.
"Oh."
His mother turned back to the stove.
"She's happy you did."
He stared at the plates.
"She said that?"
"She said, 'Kaito finally remembered I exist.'"
He groaned.
"That's exactly what she'd say."
His mother laughed.
And for the first time in a long while, he didn't feel as though the conversation about his sister had ended before it began.`;

  var c=l.charAt(0),cls="",t=l;
  if(c==="!"){cls="note";t=l.slice(1)}

  else if(c==="~"){cls="msg";t=l.slice(1)}

else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}})},{threshold:.15,rootMargin:"0px 0px -30px 0px"});ps.forEach(function(p){io.observe(p)})}

/* drifting photographs */
var cv=document.getElementById("fx"),cx=cv.getContext("2d"),W,H,m=[];

for(var q=0;q<20;q++)m.push({x:Math.random()*W,y:Math.random()*H,w:18+Math.random()*22,r:Math.random()*6.28,rv:(Math.random()-.5)*.006,v:.2+Math.random()*.35,s:Math.random()*6.28});
