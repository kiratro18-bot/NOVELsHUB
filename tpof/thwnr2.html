var T=`Kaito Moriyama returned on Thursday.
Ayane knew it was Thursday because she'd marked the day on the calendar above the cash register, and because Mrs. Takeda had spent the morning complaining that deliveries always arrived when she was trying to eat.
It was also the day Ayane had decided to stop thinking about the book.
She had lasted three days.
A personal record, considering the book had somehow invaded her sleep twice.
The bell rang at 4:11 PM.
Ayane looked up.
Kaito stood in the doorway with two canned coffees in one hand.
She looked at the cans.
Then at him.
"No."
He blinked.
"I haven't said anything."
"Whatever you're about to say, no."
He glanced at the coffee.
"One of these is for me."
"That's reassuring."
"The other one's for you."
"I don't drink coffee."
"It's milk coffee."
"I don't like milk coffee."
He considered this.
"Do you dislike happiness in general, or is it just beverages?"
Ayane returned to her ledger.
Kaito placed the can on the counter.
"Anyway, I came to ask about the book."
"Then ask."
"Have you found anything?"
"No."
"Have you looked?"
"No."
He stared at her.
She stared at the ledger.
"You're lying."
"Prove it."
He smiled.
It was an irritatingly pleased smile, the kind people wore when they discovered that the vending machine had accidentally given them two drinks.
Ayane hated it.
"Why are you so interested?" she asked.
"Because someone wrote a conversation in a book."
"That's not an answer."
"It's the answer I have."
"Then get a better one."
"Do you always interrogate your customers?"
"Only the annoying ones."
He nodded thoughtfully.
"Then I'm honored."
Mrs. Takeda's voice came from the back room.
"Ayane, if he buys something, you can insult him as much as you like."
"I'm not buying anything," Kaito called back.
"Then stop taking up space!"
He turned to Ayane.
"She likes me."
"She doesn't."
"She's hiding her feelings."
"Go away."
He laughed and pulled out the chair he'd used the previous time.
Ayane pointed at it.
"Don't sit there."
"Why?"
"Because I said so."
"Right."
He remained standing.
For almost ten seconds.
Then he sat down.
Ayane put her pen down.
"Are you trying to get thrown out?"
"Not particularly."
"Then why are you doing the exact thing I've asked you not to do?"
"Honestly? The chair looked comfortable."
She closed her ledger.
"Fine. I'll tell you one thing."
He sat up.
"The receipt is from this shop. June 22, 2021. The date on some of the handwritten messages appears to match it, but there are other notes from different years. The handwriting changes several times. Mrs. Takeda recognizes the book. She doesn't want to talk about it."
Kaito listened without interrupting.
Ayane continued.
"I also found the book's original cover online. It was published twenty-three years ago. That's all."
He stared at her.
Then glanced down at the coffee.
"You investigated it."
"No."
"You just recited four days of research."
"It was a coincidence."
"Of course."
She picked up her pen again.
Kaito didn't move.
After a while, he asked, "Did you figure out the names?"
"What names?"
"The people who wrote in it."
"No."
"Can we?"
"No."
"Why not?"
"Because I don't know where to start."
"Great. We're making progress."
She glared at him.
He grinned.
It was, Ayane decided, very unfortunate that she found his stupidity mildly entertaining.
"Fine," she said. "We can look at the book again. But we're not contacting anyone or doing anything ridiculous."
"Agreed."
"And you don't get to write in it."
"I wasn't planning to."
"And stop agreeing so quickly. It makes you look suspicious."
Kaito placed a hand over his heart.
"I can't win with you."
"You could leave."
He didn't.
They brought the book out from beneath the counter and spread it across the desk.
Ayane retrieved a notebook.
Kaito took out his phone.
She immediately pointed at it.
"Don't photograph the pages."
He looked up.
"Why?"
"Because they might contain personal things."
"We're literally reading them."
"I know."
"That's a little hypocritical."
"I know that too."
He considered arguing, then placed his phone face down.
"Okay. No photographs."
Ayane blinked.
She'd expected more resistance.
It was annoying when people made it difficult to dislike them.
She opened her notebook.
"Let's start with the handwriting."
They examined the messages one by one.
There were at least six distinct styles.
One person wrote in tiny, disciplined letters. Another used heavy pencil strokes that sometimes tore through the paper. Someone had a habit of underlining every other sentence, usually when they disagreed with something.
One writer used green ink.
Another wrote almost exclusively in blue.
There were doodles between the arguments: cats, stars, umbrellas, a badly drawn fish, and a little person with an enormous head.
Kaito pointed at the person.
"That's definitely the author."
"How do you know?"
"Look at the tragic expression. It's a man who has made terrible literary decisions."
Ayane tried not to smile.
Failed.
Then immediately stopped.
Kaito noticed.
He wisely said nothing.
They worked for nearly an hour.
At first, the task felt straightforward. Identify the handwriting, mark the dates, compare repeated words.
But the more they examined the pages, the less sense the entries made.
Some dates appeared beside arguments that seemed to begin long before them.
Some messages answered questions that hadn't been written down.
And some entries appeared to refer to events that had nothing to do with the novel.
On one page, beside a paragraph about a character leaving home, someone had written:
!You said you'd tell me before you left.
Beneath it:
!I tried.
!You sent a three-word message.
!I was seventeen.
!So was I.
Ayane reread the exchange.
The next page contained a drawing of a door with a small flower beside it.
Kaito had gone quiet.
She glanced at him.
"What's wrong?"
"Nothing."
"You've been staring at the same page for a minute."
"Maybe it's a very interesting page."
"Is there something you recognize?"
He looked up too quickly.
"No."
Ayane narrowed her eyes.
"That was a suspiciously bad lie."
"You're a suspiciously nosy person."
"I've been called worse."
"I bet."
He stood and walked to the shelves.
Ayane watched him browse aimlessly for a while.
Then she looked back at the page.
!You said you'd tell me before you left.
She didn't know why, but the sentence bothered her more than the others.
Perhaps because she knew how easy it was to say something vague and pretend it was enough.
She had done it herself.
With Emi.
With her mother.
With people who invited her places and received vague excuses until they stopped asking.
She closed the notebook.
"We should ask Mrs. Takeda what she remembers."
Kaito turned around.
"I thought she didn't want to talk."
"She didn't say she would never talk. She said she didn't know."
"That's not the same thing."
"Exactly."
Mrs. Takeda appeared in the doorway carrying a cardboard box.
"No."
Ayane looked at her.
"I haven't asked anything."
"You have the face."
"What face?"
"The one you get when you're about to make my evening difficult."
Kaito coughed into his fist.
Ayane ignored him.
"Mrs. Takeda, please."
The older woman looked at the open book.
For a moment, she seemed to forget they were there.
Then she put down the box.
"I remember the rain," she said.
Ayane sat up.
"What?"
"June 22, 2021. It rained that evening. Not much at first, but heavily after five. The old roof leaked above the front shelves, so I had to move three boxes."
She wiped her hands on her apron.
"There were students in and out all afternoon. Some came to wait for the rain to stop. Others came because they didn't have anywhere else to be."
"Do you remember anyone who wrote in this book?"
Mrs. Takeda didn't answer immediately.
"Perhaps."
"Who?"
"I'm not telling you."
Ayane's shoulders dropped.
"Why?"
"Because you don't know these people. Because their handwriting has survived longer than some friendships. Because finding a name isn't the same thing as earning the right to know a person's life."
Ayane looked at the book.
Kaito leaned forward.
"We're not trying to expose anyone."
"I believe you."
"Then—"
"I believe you," Mrs. Takeda repeated. "But you two have known each other for less than a week, and already you're trying to solve a five-year-old problem you don't understand."
Kaito opened his mouth.
Ayane elbowed him.
Mrs. Takeda continued.
"Put the book away. Go home. Eat something. Do whatever seventeen-year-olds are supposed to do."
"Is that an official instruction?" Kaito asked.
"Would you like it written down?"
"No, thank you."
"Good."
She carried the box into the back room.
Ayane sat quietly for a moment.
Then Kaito picked up the coffee he'd brought.
"You really don't like milk coffee?"
"No."
He placed it beside her notebook.
"Give it to someone."
"You're not getting it back."
"I was going to drink the other one."
"Then you should have bought only one."
He laughed.
Ayane closed the book.
"We're not going to solve this by guessing."
"Probably not."
"We need something real."
"Like what?"
She thought about the date on the receipt.
The handwriting.
The sentence about waiting until the shop closed.
A person had waited for someone.
Someone hadn't arrived.
Or perhaps someone had arrived and left without being seen.
Ayane rubbed her forehead.
"I don't know yet."
Kaito looked at the book.
"That's okay."
She glanced at him.
He wasn't joking this time.
For once, his face looked almost serious.
"We don't have to figure everything out today."
Ayane looked away.
Something about the sentence irritated her.
Perhaps because it was reasonable.
And perhaps because she wanted him to be wrong.
They put the book back beneath the counter.
Kaito left without buying anything.
At the doorway, he turned around.
"Sato?"
"What?"
"Tomorrow?"
Ayane considered telling him no.
She had homework. A test next week. A room she'd promised to clean. A message from Emi she still hadn't properly answered.
Instead, she said, "Four-thirty."
He blinked.
"Really?"
"If you're late, I'm not opening the book."
He smiled.
"Four-thirty it is."
The bell rang as he left.
Ayane sat behind the counter, listening to the rain begin again.
Then she opened her notebook.
Beneath the four questions she'd written earlier, she added a fifth.
#5. Why is he so difficult to send away?
She stared at it.
Crossed it out.
Then underlined it twice.
That evening, she received another message from Emi.
~Are you free on Sunday? Nothing special. I'm just going to the bookstore near the station.
Ayane typed a reply.
>Maybe. What time?
The response arrived almost immediately.
~Really? I'll send you the details!
Ayane looked at the screen.
Then at the notebook beside her.
For no clear reason, she felt as if she'd made a mistake.
Not a terrible one.
Just the kind that might eventually become important.`;
