var T=`The flower shop across from Tsubaki Books was called Hana no Ie.
It had been there longer than Ayane could remember.
In spring, it smelled of wet soil and lilies. In summer, the windows were crowded with bright flowers and handwritten signs. In autumn, the owner brought chrysanthemums to the entrance and complained about customers who asked for roses when they meant carnations.
Ayane had walked past it hundreds of times.
She'd never gone inside.
Until Tuesday.
She stood outside the door for almost a minute, looking at the handwritten sign.
!Today: discounted flowers after 5 PM.
It was 5:04.
She had no excuse.
She went in.
A young woman stood behind the counter, trimming the stems of a bouquet. Her dark hair was tied back with a ribbon, and a green apron was folded around her waist.
She looked up.
"Hello. Can I help you?"
Ayane immediately forgot why she'd come.
"Flowers."
The woman blinked.
Then smiled.
"That's a good place to start."
Ayane wanted to disappear into the nearest bucket of hydrangeas.
"I mean, I'm looking for something small. Not expensive."
"For someone?"
"No."
The woman waited.
Ayane looked at the flowers.
"Maybe."
The woman smiled again, but didn't tease her.
"What's the occasion?"
"There's no occasion."
"Then what are we celebrating?"
Ayane considered lying.
Instead, she said, "I don't know."
The woman seemed to understand.
She put down her scissors and led Ayane toward a small display near the window.
"These are nice if you want something simple."
There were pale yellow flowers, small white chrysanthemums, and a few stems of pink lisianthus.
Ayane pointed at the yellow ones.
"What are these?"
"Freesias."
"They look like something a grandmother would buy."
"Grandmothers have excellent taste."
Ayane picked up one stem.
It smelled faintly sweet.
"I'll take these."
The woman wrapped the flowers in brown paper.
As Ayane reached for her wallet, the woman noticed the notebook sticking out of her bag.
"Do you work at Tsubaki Books?"
Ayane looked up.
"How do you know?"
"I've seen you through the window."
The woman tied the ribbon.
"You always have that notebook."
Ayane stared.
"That's unsettling."
The woman laughed.
"Sorry. I wasn't trying to spy on you."
"It's fine."
She handed over the money.
The woman gave her the flowers.
"I'm Saki, by the way."
Ayane stopped.
The shop seemed to grow very quiet.
"Saki?"
The woman looked at her.
"Yes?"
Ayane glanced at the notebook.
Then at the flowers.
Then at the woman again.
She had no idea how to ask the question.
She had no idea whether she should ask it at all.
So she settled for the worst possible opening.
"Did you ever read a book called The House at the End of June?"
Saki's fingers went still around the paper wrapping.
For a moment, Ayane thought she'd made a terrible mistake.
Then Saki slowly put down the ribbon.
"Where did you hear that name?"
Ayane swallowed.
"At Tsubaki Books."
Saki looked toward the window.
The bookstore stood across the street, its sign reflected in the glass.
Then she said, very quietly:
"I thought that book was gone."
Kaito arrived twenty minutes later.
He found Ayane standing outside the flower shop, holding a small bouquet and looking as though she'd just been questioned by the police.
"What happened?"
She turned.
"I found her."
"Who?"
"Saki."
He stopped.
For a moment, neither spoke.
Then he looked at the flower shop.
"She's here?"
Ayane nodded.
"She works there."
Kaito glanced at the flowers.
"Did you buy those?"
"No, I stole them."
He blinked.
She held up the bouquet.
"Yes, I bought them."
"Right."
He looked toward the window.
Saki was standing behind the counter, pretending to sort ribbons while very obviously watching them.
"Did you tell her about the book?"
"Yes."
"What did she say?"
"That she thought it was gone."
Kaito rubbed his forehead.
"Okay."
"Okay?"
"What do you want me to say?"
"I don't know."
"Neither do I."
They stood on the pavement, both looking like idiots.
Finally, Kaito sighed.
"We should probably ask if she's willing to talk."
Ayane nodded.
"Agreed."
They went inside.
Saki looked up when the bell rang.
Her expression changed when she saw Kaito.
For a moment, she seemed to be searching his face for something.
Then she smiled politely.
"Can I help you?"
Kaito held up the book.
"I think this might belong to you."
Saki stared at the faded blue cover.
She didn't reach for it.
Instead, she sat down on the small stool behind the counter.
"I haven't seen that in five years."
Kaito placed it on the table.
"Yuzuna used to own a copy."
Saki looked at him.
"You know Yuzuna?"
"She's my sister."
Something flickered across Saki's face.
Surprise.
Then recognition.
Then something Ayane couldn't quite name.
"She's your sister."
Kaito nodded.
Saki looked down at her hands.
"How is she?"
He hesitated.
"She's okay."
"Good."
The word came out too quickly.
Saki laughed awkwardly.
"Sorry. I haven't seen her in a long time."
Ayane took a breath.
"We're not here to ask you anything you don't want to answer."
Saki looked at her.
Ayane continued.
"We found the messages in the book. Mrs. Takeda remembers that both of you were here on June 22, 2021."
Saki closed her eyes.
For a moment, she looked very tired.
"I waited until the shop closed," she said.
Ayane felt a chill travel down her arms.
The exact words.
The exact message.
Saki looked toward the bookstore.
"I thought she was going to come inside. I thought she'd walk through the door, sit beside me, and explain why she hadn't told me she was leaving."
Kaito was very still.
"She was outside," he said.
Saki looked at him.
"What?"
"Mrs. Takeda remembers someone standing outside in the rain."
Saki stared at him.
Then she laughed.
It wasn't a happy laugh.
"Of course she was."
She leaned back against the wall.
"Of course."
Neither Ayane nor Kaito knew what to say.
Saki looked at the book.
"I don't blame her anymore. Not exactly."
She picked up a ribbon and began winding it around her fingers.
"At seventeen, I thought everyone who left me was making a decision about my worth. It took me a while to realize people could care about me and still leave."
She paused.
"Doesn't mean it didn't hurt."
Ayane looked down at her shoes.
She understood that part.
More than she wanted to admit.
Saki glanced at the book again.
"Did Yuzuna send you?"
"No," Kaito replied. "She doesn't even know I found the book until recently."
"Does she know you're here?"
"No."
Saki nodded.
"Then don't tell her anything about me without asking."
"We won't," Ayane said.
Saki looked at her for a long moment.
Then she smiled faintly.
"Thank you."
She stood and returned the ribbon to its drawer.
"I need to close soon. My mother gets annoyed when I stay late."
Kaito picked up the book.
"Of course."
As they reached the door, Saki called after them.
"Wait."
They turned.
Saki looked at the book.
"I don't want it back."
Kaito blinked.
"Are you sure?"
She nodded.
"It belongs somewhere else now."
She turned toward the shelves behind the counter.
"Maybe it always did."
Ayane looked at her.
For once, she didn't ask what she meant.
She simply nodded.
And they left.
It began raining before they reached the café.
Not heavily at first.
Just a few drops that became more frequent as the sky darkened.
Kaito looked up.
"Great."
Ayane held her flowers closer to her chest.
"You brought an umbrella, right?"
He gave her a look.
"Why would I bring an umbrella? It's only raining."
She stopped walking.
He stared at her.
Then at the sky.
Then back at her.
"That was sarcasm."
"It wasn't very good."
"You're not very good at appreciating things."
They ducked into the café next door.
It was busier than usual, and the only available seats were near the corner window.
Ayane recognized the couple sitting at the table beside theirs.
The boy was attempting to feed the girl a bite of his sandwich.
She pushed his hand away.
"Stop that. I'm drawing."
"You haven't eaten anything."
"I had half your fries."
"That was forty minutes ago."
"Time flies."
He looked at the sandwich.
Then offered it again.
She sighed, took a bite, and returned to her sketchbook.
The boy smiled as if he'd just won an important legal case.
Ayane stared for a second.
She had seen them here before.
She'd even called them disgusting.
Now she wasn't sure why.
The girl turned a page in her sketchbook.
A loose sheet slipped free and drifted to the floor.
Ayane caught it before the paper slid beneath another table.
"Excuse me."
The girl turned.
"Oh! Thank you."
Ayane held out the sheet.
It was a pencil drawing of the café window during rainfall. Two figures sat at a table, one holding a sandwich while the other pretended not to smile.
The drawing was unfinished.
But it felt strangely familiar.
"You drew this?" Ayane asked.
The girl nodded.
"I'm Mei."
"Hiro," the boy added, raising a hand.
Then he looked down at the sandwich.
"Although, apparently, I'm currently being ignored by my own girlfriend."
Mei didn't look at him.
"You're not being ignored. You're being managed."
"That's worse."
"Eat your sandwich, Hiro."
He did.
Ayane returned the drawing.
"You're really good."
Mei looked at the paper, then at Ayane.
"Thanks. I'm still working on the shadows."
"The shadows look fine."
"They always look fine until I put them next to the wrong shade of grey."
Hiro leaned over.
"She's been saying that for three days."
"Because it's been three days."
"You've drawn the same window twelve times."
"Thirteen."
He paused.
"That doesn't make it better."
"It makes it accurate."
Kaito returned from the counter carrying two hot drinks.
He looked between them.
"Did I miss something?"
"A stranger rescued a drawing," Ayane said.
Mei smiled.
"She caught it before it went under the next table."
Hiro glanced at the sheet.
"Good. That one's actually nice."
Mei slowly turned toward him.
"Actually?"
He froze.
"...Very nice."
"Thank you."
Ayane hid a smile behind her cup.
Then Mei's gaze fell on the faded blue paperback beside Kaito.
"What's that book?"
Kaito glanced down.
"The House at the End of June."
Mei tilted her head.
"Interesting title."
"It's caused us more trouble than it deserves," Ayane said.
Hiro leaned over slightly.
"Is that the old novel from Tsubaki Books?"
Everyone looked at him.
Ayane blinked.
"You know it?"
"Not personally. Mei found a copy there once, years ago, when she was looking for reference books for a comic."
Mei nodded.
"The owner had a stack of old books near the window. I liked the cover, but I didn't end up buying it."
She looked at the blue paperback again.
"Why?"
Ayane hesitated.
They had no reason to tell strangers about the messages. But there was something easy about talking to Mei, something that didn't feel like being questioned.
"It's full of handwritten arguments," she said. "People have been writing in it for years."
Hiro looked at Mei.
"That sounds familiar."
Mei slowly turned her head toward him.
"What is that supposed to mean?"
"Nothing."
"Hiro."
"You once wrote a three-page review of a vending machine because it gave you the wrong drink."
"It was a detailed complaint."
"It was a vending machine."
"It stole my money."
Hiro looked at Ayane and Kaito.
"See what I live with?"
Mei kicked his ankle beneath the table.
He winced.
Ayane laughed before she could stop herself.
Mei smiled at her.
"Anyway, old books can be strange. Sometimes people write things in them that they couldn't say directly."
She looked down at her drawing.
"I used to hide my sketches because I thought people would misunderstand them. Sometimes I still do."
Ayane glanced at the book.
"What changed?"
Mei shrugged.
"Nothing, really. I just got tired of deciding what other people would think before they had a chance to look."
Hiro reached across the table and took a fry from her plate.
Mei slapped his hand.
"That was mine."
"You had six."
"I was saving that one."
"For what? Retirement?"
"Give it back."
He ate it.
She stared at him in absolute disbelief.
"You're the worst."
"And yet you keep feeding me."
"I don't feed you. You steal."
Hiro grinned.
Ayane looked away, trying not to smile.
They were ridiculous.
Absolutely ridiculous.
And perhaps that was what made them seem so comfortable together.
They didn't need every moment to mean something.
Sometimes a sandwich was just a sandwich.
Sometimes an argument was just an argument.
Sometimes two people could be annoyed with each other and still reach for the same umbrella when the rain began.
A sharp gust rattled the café window.
Outside, a woman hurried past, holding a newspaper over her head.
Hiro checked the time.
"We should go."
Mei packed her sketchbook.
"You're the one who said we had another twenty minutes."
"That was before the rain started."
"The rain started before we arrived."
"Exactly. I'm adapting."
They stood.
Mei slipped her sketchbook into her bag, but one corner caught on the zipper.
Ayane stepped forward and helped her free it.
"Thanks," Mei said.
"No problem."
Hiro picked up his umbrella, opened it, and looked toward the door.
Then he noticed Kaito staring at the rain outside.
"Forgot yours?"
Kaito shrugged.
"I thought it would stop."
Hiro looked at the sky.
"Bold strategy."
He glanced at Mei.
She sighed and took the spare folded umbrella from his bag.
"Here."
Kaito blinked.
"Really?"
"We have another one," Mei said. "Just bring it back to Tsubaki Books. Hiro will forget where we left it otherwise."
"I will not."
"You left your sketchbook at the café last month."
"You were the one who found it."
"Exactly."
Hiro looked at Kaito.
"She's right. I would've forgotten."
Mei handed over the umbrella.
Kaito took it carefully.
"Thanks. We'll return it."
"Don't worry about rushing," Mei said.
Then she looked at Ayane.
"Good luck with the book."
Ayane smiled faintly.
"Thanks."
The couple stepped into the rain together.
Hiro held the umbrella.
Mei took the handle from him almost immediately because he was holding it too high on one side.
He complained.
She ignored him.
Their voices faded into the noise of the street.
Ayane watched them for a moment.
Then turned toward Kaito.
"Don't say it."
He blinked.
"Say what?"
"Whatever you're thinking."
He smiled.
"I was just thinking that you called them disgusting."
Ayane put her head in her hands.
"I hate you."
"No, you don't."
She looked at him.
He looked back.
Neither of them smiled for several seconds.
Then Ayane burst out laughing.
And Kaito joined her.
Outside, the rain continued.
But for the first time that afternoon, neither of them felt in a hurry to leave.
Later that evening, Ayane wrote a new note in her notebook.
#6. Some people are allowed to be happy without explaining how they managed it.
She stared at the sentence.
Then crossed it out.
It sounded too much like something a teacher would say.
Instead, she wrote:
#6. Return the umbrella.
That was much better.`;

  cx.clearRect(0,0,W,H);cx.fillStyle="hsla(52,"+S+"%,"+L+"%,"+A+")";
  m.forEach(function(d){d.y+=d.v*.5;d.x+=Math.sin(d.y*.02+d.r)*.7;d.r+=.02;if(d.y>H+10){d.y=-10;d.x=Math.random()*W}
    cx.save();cx.translate(d.x,d.y);cx.rotate(d.r);cx.beginPath();cx.ellipse(0,0,d.s*1.6,d.s*.8,0,0,6.28);cx.fill();cx.restore()});
  requestAnimationFrame(frame)}
if(!RM)frame();
