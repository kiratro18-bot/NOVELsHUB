~Of course I remember it. I thought I lost that copy.
Kaito stared at the message.
Then typed:
>Did you write in it?
The reply took twelve minutes.
~Some of the drawings. The writing too, I think. Why?
He took a photograph of one of the pages.
Then hesitated.
He could ask her about the receipt.
About the date.
About the girl named Mio.
But he didn't want to dump five years of silence into one conversation.
So he wrote:
>Can we talk on the phone sometime?
Her answer came almost immediately.
~Yes. When are you free?
He looked at the clock.
Then at his schoolbag.
Then at the book.
>Sunday?
~Sunday works.
He put the phone down.
For the next three hours, he behaved as if he'd just received a university acceptance letter.
He cleaned his room.
He finished his homework.
He even sorted the drawer of useless things.
He found the broken keychain.
The plastic dinosaur.
The old receipt.
The bookmark from Yuzuna's book.
He placed them in a small box.
Then stared at it.
He hadn't thrown anything away.
He'd simply moved the mess somewhere else.
Progress, apparently.
At school, Ayane was having a terrible day.
Her mathematics teacher had returned a test.
She had scored forty-six.
This was not unusual.
What was unusual was that she'd been so distracted by the book that she had forgotten to answer the final two questions.
She stared at the paper.
Then at Emi's score.
Eighty-eight.
"Don't look at mine," Emi said.
"I'm not."
"You're looking directly at it."
"I'm comparing the handwriting."
"Sure."
Ayane turned away.
Emi leaned over.
"Are you okay?"
"Fine."
"You're doing the thing again."
"What thing?"
"The thing where you say fine because the real answer requires more than one sentence."
Ayane looked at her.
Emi held up both hands.
"Sorry. I'll stop."
"No."
Ayane took a breath.
"I'm thinking about something."
"Something good?"
"I don't know."
"Something bad?"
"I don't know."
Emi nodded.
"Okay."
Ayane stared at her.
"That's it?"
"What?"
"You're not going to ask?"
Emi looked puzzled.
"You just told me you don't know."
Ayane had no answer.
Emi packed her books.
"Come over after school. My mother bought too many pastries again."
"Why?"
"Because she thinks buying pastries will somehow stop my brother from eating all the pastries."
"Will it?"
"No. But watching him try to hide the wrappers is very entertaining."
Ayane considered the invitation.
Then nodded.
"Okay."
Emi smiled.
"Good. And if you cancel, I'll come to your house and eat your family's food instead."
"That's a threat."
"It's a promise."
They walked to class together.
Ayane still felt anxious.
She still wondered whether she would say something awkward or whether Emi would suddenly discover that she was much more interesting without her.
But she went anyway.
That counted for something.
That evening, Ayane arrived at Tsubaki Books to find Kaito standing beside the counter with a paper bag.
She stopped.
"What's that?"
"Food."
"I can see that."
"Then we're making progress."
She stared at him.
He smiled.
Inside the bag were two sandwiches.
One looked perfectly normal.
The other contained a suspicious quantity of mayonnaise.
Ayane took a step back.
"What is that?"
"Tuna."
"And?"
"Apple."
She closed her eyes.
"Why?"
"Because I was thinking about something."
"Apparently not very hard."
He laughed.
Then offered her the normal sandwich.
She took it.
They sat on the floor between two shelves because the only free table was covered in boxes.
For a while, they ate without talking.
Then Kaito said, "I'm calling my sister on Sunday."
Ayane looked at him.
"How do you feel?"
"Terrible."
"Good."
He turned toward her.
"Good?"
"Not good that you feel terrible. Good that you're doing it anyway."
He considered that.
Then nodded.
"That's annoyingly reasonable."
"I learned from the best."
They finished their sandwiches.
Ayane brushed crumbs off her skirt.
"Can I ask you something?"
Kaito looked at her.
"Is it about my sandwich?"
"Why do you keep things you don't need?"
He went still.
The question hung between them.
Ayane immediately wanted to take it back.
"Sorry. You don't have to answer."
"It's okay."
He looked at the paper bag.
"I think I like knowing things existed."
She waited.
He picked at the label.
"A ticket from a trip means I went somewhere. A broken keychain means someone gave it to me. A receipt means I ate something on a day I might otherwise forget."
He shrugged.
"It doesn't have to mean anything important."
He looked at her.
"Sometimes I just don't want to throw away a perfectly good memory because the object stopped being useful."
Ayane thought about that.
She had very few keepsakes.
She deleted old photographs when her phone became full. She threw away notebooks once she'd finished a school year. She rarely reread messages.
It had never occurred to her that keeping something could be a way of making room for the past.
"What about things that hurt?" she asked.
Kaito looked down.
"Those are harder."
She nodded.
Neither spoke for a while.
Then he said, "What about you?"
"What about me?"
"Why do you hate not knowing things?"
She stiffened.
"I don't."
He gave her a look.
She sighed.
"Fine. Maybe I do."
"Why?"
She stared at the shelves.
"Because when I don't know what someone thinks, I start guessing. And when I guess, I usually imagine the worst."
Kaito was quiet.
"So I try to figure things out before anyone can surprise me," she continued. "I make lists. I plan what I'll say. I decide whether people like me based on absolutely nothing."
She laughed awkwardly.
"It's stupid."
"No," he said.
She glanced at him.
"It's exhausting," he added. "But it's not stupid."
Ayane looked away.
For a moment, she didn't know what to do with the kindness in his voice.
So she did what she usually did.
She tried to ruin it.
"You're getting sentimental."
"Sorry. I can insult your sandwich instead."
"You didn't bring me the bad sandwich."
"Exactly. I was saving the worst part of myself for later."
She laughed.
He smiled.
And for a moment, she forgot to worry about what would happen next.
On Sunday, Kaito called his sister.
The phone rang.
And rang.
And rang.
He almost hung up.
Then she answered.
"Hey, idiot."
His eyes widened.
"Hey."
"Wow. You actually called."
"You said we should talk."
"I did. I wasn't sure you'd remember."
He looked at the box beside his desk.
The broken keychain.
The old bookmark.
The things he had kept because he didn't know how to return them.
"I remember," he said.
There was a pause.
Then Yuzuna asked, more softly, "How have you been?"
Kaito opened his mouth.
He had a dozen possible answers.
*Fine.
*Busy.
*School's annoying.
Instead, he said, "I missed you."
The silence on the other end was so complete that he checked whether the call had disconnected.
Then his sister made a strange noise.
A laugh that wasn't quite a laugh.
"Oh, you absolute idiot."
He smiled.
"Yeah."
"I missed you too."
Neither of them said anything for a while.
They didn't solve the argument.
They didn't apologize for everything.
But they stayed on the phone for forty minutes.
They talked about their mother, school, Yuzuna's apartment, and a cat she had started feeding outside her building.
Kaito complained that she'd named it something embarrassing.
Yuzuna accused him of having no imagination.
They argued about whether their father could cook.
Then, just before hanging up, she said:
"Hey, Kaito?"
"Yeah?"
"Do you still have my blue bookmark?"
He looked at the desk.
The old one lay beside the box.
"Yeah."
A pause.
"Keep it for now," she said.
"Okay."
"And don't lose it."
"I won't."
She laughed.
"I know you won't."
The call ended.
Kaito sat quietly for a moment.
Then he picked up the bookmark.
It was still bent at the corner.
Still faded.
Still covered in his sister's handwriting.
But for the first time in years, it no longer felt like something he couldn't return.
It felt like something he had been allowed to keep.
For now.`;
