var T=`Kaito's house had too many drawers.
That was his mother's opinion.
His opinion was that the drawers were perfectly reasonable, and the actual problem was that nobody else understood how to use them.
The drawer beneath the television contained charging cables.
The drawer beside the entrance contained keys, batteries, spare masks, and three different types of tape.
The drawer in his room contained things he couldn't explain.
A broken keychain.
A railway ticket from a trip he barely remembered.
A button from an old cardigan.
A receipt for a meal he'd eaten two years ago.
A small plastic dinosaur missing its left arm.
And a bookmark.
The bookmark was the reason he was sitting on his bedroom floor at seven in the evening, holding a paperback book he'd borrowed from his older sister five years ago.
He hadn't borrowed it, technically.
He'd taken it from her desk when he was twelve because she was leaving for school and he wanted to annoy her.
She'd chased him around the house for ten minutes.
He'd laughed.
She'd threatened to throw his game console out the window.
It was a perfectly ordinary afternoon.
Then she left.
And somehow, the book stayed with him.
Itsuki turned the bookmark over.
On the back, in his sister's handwriting, were the words:
!Return this when you're done, idiot.
He had been done for approximately five years.
His phone lit up beside him.
A message from Ayane.
~Did you find anything?
He typed:
>No.
Then added:
>I found three yen in my pocket, though.
She replied:
~Incredible detective work.
He smiled at the screen.
Then his eyes moved toward the wardrobe.
His sister's old room was still being used for storage, but a box of her belongings remained beneath the bed. His mother had suggested sorting it several times.
Kaito had always found something else to do.
He wasn't proud of that.
He wasn't proud of a lot of things.
He opened the box.
Inside were old schoolbooks, notebooks, a scarf, two faded photographs, and a collection of paperback novels.
He pulled them out one by one.
There was a cookbook.
A mystery novel.
A book of poems.
And at the bottom, a thin paperback with a blue cover.
His heart gave a strange little jump.
*The House at the End of June.
He sat down.
The copy he'd found at Tsubaki Books was the same edition, though its cover had been more damaged. This one was clean enough to read, its spine slightly bent but intact.
He opened the front cover.
On the inside flap, someone had written:
!Yuzuna Moriyama. Class 2-B.
His sister's name.
Below it, in smaller writing:
!If found, return to the owner. She bites.
Kaito stared at the page.
Then laughed once, softly.
"Of course."
He turned the page.
There were no annotations in the margins.
Not on the first few pages.
But near the middle, a small drawing appeared beside a paragraph about a girl standing outside a house.
A little cat.
An angry cat.
He recognized the way its ears had been drawn.
He recognized the tiny scar on its left paw, a detail that made no sense on an imaginary animal.
His sister used to draw cats like that on his mathematics worksheets.
She'd drawn one on his hand when he was ten, then refused to wash it off for him because, apparently, he needed to learn responsibility.
It had taken three days to disappear.
Kaito turned another page.
There was a tiny blue umbrella.
Then a badly drawn fish.
Then a sentence in the margin.
!The ending was unfair.
His smile faded.
He picked up his phone and opened his sister's contact.
#Yuzuna.
Her profile picture showed a ceramic cup on a windowsill.
He had no idea where she'd taken it.
The last message between them was from three weeks ago.
>Mom says your train arrives at 8:20. Do you want me to pick you up?
His sister had replied:
~No, don't worry. I've got it.
He'd sent a thumbs-up.
That was their relationship in miniature.
Polite.
Functional.
Completely inadequate.
He scrolled upward.
There were older messages.
A picture of a birthday cake.
A complaint about their father's terrible cooking.
A photograph of a cat sleeping on a washing machine.
His sister had sent him that one because she'd known he would laugh.
He remembered laughing.
He couldn't remember the last time they'd spoken for more than five minutes without someone checking the clock.
His phone buzzed.
Ayane again.
~You there?
He typed:
>I found something.
Then paused.
He could tell her.
He could explain that his sister had owned the book, that she'd written in another copy of it, that there might be a connection.
Instead, he typed:
>Nothing important.
He sent it.
The moment the message disappeared, he wanted to throw his phone across the room.
He didn't.
It was an expensive phone.
And he was, apparently, a coward with excellent financial instincts.
The next afternoon, Kaito arrived at Tsubaki Books five minutes early.
Ayane looked up from the counter.
"You're early."
"That's an accusation."
"It's an observation."
"I can leave and come back at four-thirty."
"Please do."
He smiled.
Then he noticed the notebook beside her.
She had written a list of dates and handwriting styles.
He leaned over.
"Wow."
"What?"
"You made a chart."
"It's a list."
"With columns."
"That's how lists work."
He sat down.
Ayane opened the book again.
"I found something yesterday."
"So did I."
She looked at him.
He immediately wished he hadn't said it.
"What?"
"Nothing."
Her eyes narrowed.
"Moriyama."
He froze.
It was the first time she'd used his surname without sounding as though she was reading it from a wanted poster.
"Yes?"
"What did you find?"
He looked at the book.
Then at the notebook.
Then at her.
"My sister used to own this edition."
Ayane blinked.
"Your sister?"
"Yeah. She had it when she was in high school."
"Was she one of the people writing in it?"
"I don't know."
"Do you recognize the handwriting?"
"Some of it."
"Then why didn't you say so yesterday?"
He rubbed his forehead.
"Because I wasn't sure."
"That's not a reason to lie."
He looked up sharply.
"I didn't lie."
"You said you found nothing."
"I said nothing important."
"That is a lie with extra steps."
"You're impossible."
"And you're avoiding the question."
They stared at each other.
Then Kaito looked away.
"My sister moved out a few years ago. She left a lot of things behind. I haven't really looked through them."
Ayane's expression changed slightly.
"Why not?"
"Because I didn't want to."
It came out more sharply than he'd intended.
Ayane went quiet.
Kaito exhaled.
"Sorry."
She picked up her pen.
"You don't have to tell me everything."
"I know."
"But if we're investigating this together, you have to tell me when something matters."
He looked at her.
She was watching the notebook instead of him.
"I know," he repeated.
This time, he meant it.
They examined the book for another hour.
Kaito pointed out several doodles that looked familiar.
Ayane recorded them.
Neither mentioned his sister again.
But when he left, he stopped at the doorway.
"Sato?"
"What?"
"Do you ever keep things just because you're afraid of losing them?"
She frowned.
"What does that have to do with anything?"
He shrugged.
"Nothing."
He stepped outside.
For a moment, Ayane considered calling him back.
Instead, she watched him disappear around the corner.
Then she opened her notebook to a clean page.
At the top, she wrote:
#Yuzuna Moriyama.
Beneath it:
#Possible connection to the book.
She stared at the name.
Then, almost against her will, she added:
#Ask Kaito when he's ready.
It was a small thing.
But it felt different from the other questions she'd written.
For once, she wasn't trying to find an answer.
She was leaving room for someone to give it to her.`;

document.getElementById("mins").textContent=Math.round(words/200)+" min read";

host.innerHTML=lines.map(function(l,i){

else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("v");io.unobserve(e.target)}})},{threshold:.15,rootMargin:"0px 0px -30px 0px"});ps.forEach(function(p){io.observe(p)})}

function upd(){tick=false;var m=document.documentElement.scrollHeight-innerHeight;prog.style.transform="scaleX("+(m>0?Math.min(1,scrollY/m):0)+")"}
addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});addEventListener("resize",upd);upd();

/* drifting dust motes */
var cv=document.getElementById("fx"),cx=cv.getContext("2d"),W,H,m=[];

  requestAnimationFrame(frame)}

</script>
