"Hey."
"Hey."
"Everything okay?"
"Yeah."
"You're calling at ten-thirty. That's usually a bad sign."
He sat on his bed.
"I found someone who remembers the book."
There was a pause.
"Who?"
"Saki."
Silence.
Then Yuzuna said, "Where?"
"At the flower shop across from Tsubaki Books."
"She's there?"
"Yeah."
Yuzuna let out a breath.
"Of course she is."
Kaito stared at the wall.
"Do you want to talk to her?"
"I don't know."
"Okay."
Another pause.
Then Yuzuna asked, "Did she say anything about me?"
"She said she waited until the shop closed."
Yuzuna closed her eyes.
"She did?"
"Yeah."
A long silence followed.
Then his sister laughed softly.
"That's funny."
"What's funny?"
"Nothing."
"Yuzuna."
She was quiet for a moment.
Then she said, "I stood outside that shop for an hour."
Kaito sat up.
"What?"
"I arrived early. I was going to tell her everything. That I was leaving for school. That my parents were separating. That I didn't know where I'd be living in a few months. All of it."
She laughed once.
"I had a whole speech prepared. It was terrible."
Kaito didn't interrupt.
"But when I got there, she was inside. I could see her through the window."
"Then why didn't you go in?"
"Because we had argued the day before."
Yuzuna's voice grew quieter.
"I thought she didn't want to see me. She was sitting with her back to the window, reading. She looked so calm that I thought… maybe she was relieved."
Kaito swallowed.
"So you left?"
"Eventually."
Yuzuna exhaled.
"I wrote that message on the receipt. I was going to leave it where she'd find it."

"Yes."
"Why didn't you go inside?"
"Because I was seventeen and stupid."
Kaito smiled faintly.
"That's not an excuse."
"No, it isn't."
She was quiet.
Then she said, "I didn't know she'd been waiting for me."
Kaito looked down at the book on his desk.
"Neither did she."
Yuzuna began to cry.
Not loudly.
Just a small, broken sound, followed by several seconds of silence.
Kaito didn't know what to do.
His sister had always been the one who knew what to do.
She'd helped him with homework, taught him how to ride a bicycle, and once spent two hours trying to convince him that a dead houseplant could be revived if they watered it enough.
He'd never heard her cry like this.
So he did the only thing he could think of.
He stayed on the phone.
After a while, Yuzuna wiped her face.
"Sorry."
"Don't."
"I didn't mean to—"
"Yuzuna."
She stopped.
He took a breath.
"I'm sorry too."
The words felt strange.
Heavy.
Necessary.
"I'm sorry I made you feel guilty for leaving. I'm sorry I didn't answer your calls. And I'm sorry I acted like I didn't care."
His throat tightened.
"I did care. I still do."
His sister didn't reply immediately.
Then she said, "I know."
He closed his eyes.
"I just wanted you to stay."
"I know that too."
He laughed awkwardly.
"You're supposed to make fun of me right now."
"I can still do that."
"Good."
She laughed through the remaining tears.
For a while, they talked about ordinary things.
The weather.
Their mother's plans for the weekend.
A terrible restaurant Yuzuna had visited.
Eventually, Kaito asked, "Do you want to see Saki?"
Yuzuna was quiet.
"I don't know."
"That's okay."
"I might say something stupid."
"Probably."
She laughed.
"You're a terrible little brother."
"I learned from the best."
She was quiet again.
Then she said, "Maybe."
Kaito waited.
"Maybe I'd like to see her."
He smiled.
"Okay."
"Don't arrange anything without asking us both."
"I won't."
"And don't act like you're fixing us."
"I'm not."
"Good."
She paused.
"You're allowed to help, though."
Kaito looked at the book.
"Okay."
When the call ended, he sat quietly for a long time.
Then he messaged Ayane.
>She wants to talk to Saki. Maybe.
Ayane replied:
~That's good.
He typed another message.
>Thanks for not pushing.
The reply took a minute.
~I wanted to.
He laughed.
Then she sent another message.
~But I didn't.
He stared at the screen.
Then typed:
>I'm glad.
He put the phone down.
For once, he didn't feel as though he'd left something unfinished.
Not completely, anyway.
The next day, Ayane met Yuzuna at Tsubaki Books.
Kaito had warned her that his sister could be intimidating.
He had been lying.
Yuzuna was intimidating in the way people became intimidating when they were perfectly comfortable being themselves. She wore a long coat, carried a canvas bag full of stationery, and had a habit of looking directly at people when they spoke.
Ayane immediately forgot how conversations worked.
"So," Yuzuna said.
Ayane nodded.
"Yes."
Yuzuna waited.
Ayane said nothing.
Kaito, standing behind them, covered his face with one hand.
"She's usually less terrifying than this," he told his sister.
"I'm not terrifying," Yuzuna replied.
"You are when you use complete sentences."
She hit him lightly on the arm.
Ayane relaxed by approximately three percent.
Yuzuna looked at her.
"You're Ayane, right?"
"Yes."
"Thank you for helping Kaito."
Ayane blinked.
"I didn't do much."
"You got him to talk about things he'd been avoiding for years. That's more than most people manage."
Kaito groaned.
"Please don't make this weird."
"I'm your sister. Making things weird is my responsibility."
Ayane almost smiled.
Then Yuzuna looked at the book.
"Can I see it?"
Kaito handed it over.
She opened the cover carefully.
For a while, she didn't say anything.
Then she turned the pages.
Her fingers stopped at a tiny drawing of a cat.
She smiled.
"I remember this."
Ayane sat beside her.
"Did you write the messages?"
"Some of them."
"Which ones?"
Yuzuna pointed at the blue ink.
"Those are mine."
Then the pencil.
"Those are probably mine too, but I was using a different pencil, so I can't be certain."
She laughed.
"I used to write in this book whenever I was upset. It was easier than talking to people."
Ayane looked at the page.
"What about the message from June 22?"
Yuzuna went still.
She touched the sentence with one finger.
!If you're reading this, I'm sorry I never came back.
"I wrote that later," she said quietly. "After I moved."
"Why?"
Yuzuna stared at the book.
"Because I thought I'd ruined everything."
She closed it.
"I'd spent so much time imagining what I'd say to Saki that when the moment came, I couldn't say anything at all."
She laughed awkwardly.
"I thought I'd have another chance. I thought I could come back in a week, or a month, or after things had settled down."
She looked toward the window.
"But time doesn't really wait for you to feel ready."
Ayane looked at her.
For once, she didn't reach for her notebook.
She simply listened.
Yuzuna took out her phone.
"I want to write to her."
Kaito looked up.
"Are you sure?"
"No."
She smiled faintly.
"But I want to."
Ayane nodded.
"Then do that."
Yuzuna looked at her.
"You're not going to tell me what to write?"
"No."
"Even though you've been investigating this for days?"
"Especially because I've been investigating this for days."
Yuzuna laughed.
Then she opened a new message.
She typed slowly.
Stopped.
Deleted the sentence.
Tried again.
Eventually, she turned the phone toward Kaito.
He read it.
His expression softened.
Ayane didn't look.
It wasn't her message to read.
Yuzuna hesitated for a moment.
Then she pressed send.
The message disappeared.
Nobody spoke.
Outside, a bicycle passed through a puddle.
Somewhere in the café, a chair scraped against the floor.
Life continued.
And for the first time in five years, a message had crossed the distance between two people who had spent too long waiting for the other to speak first.`;
