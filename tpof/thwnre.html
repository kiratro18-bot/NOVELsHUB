var T=`Six months later, Tsubaki Books had a new sign above the entrance.
Mrs. Takeda insisted it was temporary.
Ayane thought it looked terrible.
Kaito thought it looked charming.
They had been arguing about it for twenty minutes.
"That blue is too dark," Ayane said.
"It's a bookstore sign. It doesn't need to win an award."
"It needs to be readable."
"It is readable."
"From where?"
Kaito stepped onto the pavement.
"Here."
He walked toward the crossing.
Then turned around.
"Still readable."
Ayane folded her arms.
"You're impossible."
He grinned.
"Yet you keep showing up."
She looked away.
He laughed.
The book remained on the display inside.
The handwritten notes had become a minor local curiosity. Occasionally, customers asked about the receipt or the names in the envelope. Mrs. Takeda answered what she could and politely refused to answer the rest.
Nobody ever discovered who had drawn the badly proportioned fish.
Kaito maintained that it was a deliberate artistic choice.
Ayane maintained that it was a crime.
They had been together for four months.
They had not agreed on a label for the first three weeks.
Kaito had called her his girlfriend in front of a vending machine, then spent the next ten minutes trying to explain why he'd said it before asking.
Ayane had been embarrassed enough to consider moving to another prefecture.
Instead, she'd held his hand.
Things were still awkward sometimes.
They still argued.
He still made terrible sandwiches.
She still took too long to answer messages.
But now, when she was worried about something, she tried to say it before the silence became a problem.
And when he felt as though he were keeping something just because he was afraid of losing it, he tried to ask himself whether he wanted the memory or the object.
He didn't always know.
Neither of them was particularly good at growing up.
They were simply trying.
On a rainy Saturday afternoon, Ayane and Kaito stopped at the café next door.
It was crowded.
Most of the tables were occupied, including the corner one by the window.
Hiro and Mei were sitting there.
Mei was drawing in her sketchbook while Hiro attempted to convince her to try a piece of his sandwich.
She refused.
He tried again.
She took the sandwich out of his hand, ate a bite, and gave it back.
He looked far too pleased with himself.
Ayane shook her head.
"They're still like that."
Kaito glanced at the table.
"Who?"
"The couple from before."
"The couple from the café?"
"Yes."
"You know their names."
"They told us."
"Then they're not exactly strangers anymore."
"They're practically strangers."
Kaito considered this.
"That's a very specific category of person."
"Don't start."
They found a table near the window.
Hiro noticed them and lifted a hand in greeting.
"Hey! Umbrella people!"
Kaito blinked.
Ayane covered her face.
"Please don't call us that."
Mei looked up from her sketchbook.
"Oh, you're the ones who borrowed the umbrella."
Kaito nodded.
"We brought it back to Tsubaki Books the next morning."
"And Mrs. Takeda left it behind the counter for three days," Ayane added. "Apparently, nobody remembered whose it was."
Hiro looked at Mei.
"See? That's why I label things."
Mei slowly turned toward him.
"You have never labelled anything in your life."
"I labelled the rice cooker."
"You wrote 'rice' on the rice cooker."
"Exactly."
"That doesn't count."
"It identifies the object."
"It is a rice cooker, Hiro."
Kaito laughed.
Ayane tried not to.
Failed.
Mei smiled at them.
"Please sit. We're not doing anything interesting."
Hiro looked wounded.
"Speak for yourself. I've been trying to eat this sandwich for ten minutes."
"Because you keep talking."
"I'm a conversational person."
"You're a hungry person."
"Both can be true."
Ayane and Kaito settled into their seats.
For a few minutes, the four of them talked about ordinary things.
School.
Exams.
The bookstore's new sign.
The flower shop, where Saki had started selling small bouquets wrapped in old book pages.
Hiro seemed particularly interested in that last detail.
"Wait, actual book pages?"
"Not from readable books," Ayane explained. "Damaged ones. Mrs. Takeda gives her the pages that can't be repaired."
Mei looked delighted.
"That's actually a nice idea."
Kaito grinned.
"Don't tell Ayane. She'll start making lists of which flowers match which book genres."
"I already did that."
Everyone turned toward her.
Ayane froze.
Hiro slowly put down his sandwich.
"You did what?"
"It was a draft."
"Of course it was."
Mei leaned across the table.
"Which flowers go with mystery novels?"
Ayane looked away.
"Dark red roses. Or white lilies, depending on the ending."
Hiro nodded solemnly.
"Excellent."
Kaito stared at him.
"You're encouraging her."
"Obviously."
Mei opened her sketchbook and scribbled something down.
"Romance novels?"
Ayane hesitated.
"Freesias, maybe."
Mei looked up.
"That's actually perfect."
Ayane blinked.
"You think so?"
"Yeah. They're small, but they smell lovely. And they don't need to be the biggest flowers in the room to be noticed."
She paused.
"That's probably a terrible explanation."
"No," Ayane said. "It's fine."
Mei smiled and returned to her drawing.
Hiro leaned back in his chair.
"She's good at that."
"At what?" Kaito asked.
"Making things sound reasonable."
Mei didn't look up.
"Unlike you."
"Exactly. I'm the unreasonable one."
"At least you're self-aware."
He pointed at her.
"That was an insult."
"Congratulations."
Kaito laughed so hard he nearly spilled his drink.
Ayane reached for a napkin before it could fall onto the table.
"Honestly," she muttered.
Hiro looked at them.
"You two remind me of us when we first met."
Mei paused.
"Did we argue this much?"
"You once told me my umbrella etiquette was embarrassing."
"Because you kept getting me wet."
"You could have held the umbrella yourself."
"I did."
"And you made me hold your sketchbook."
"Because you offered."
"I was being polite."
"You were being useful."
He stared at her.
She stared back.
Then both of them started laughing.
Ayane smiled.
For the first time, she understood what she'd found so irritating about them months ago.
It wasn't that they were perfectly happy.
They weren't.
They disagreed about silly things. They stole food from each other. They occasionally looked annoyed enough to end the relationship over a badly positioned umbrella.
But they didn't seem to spend every moment worrying about what the other person meant.
They just asked.
Sometimes they argued.
Sometimes they were wrong.
And sometimes, after all that, they shared a sandwich.
Mei turned her sketchbook toward Ayane.
On the page was a drawing of the four of them at the café.
Hiro was holding his sandwich.
Mei was pretending not to steal it.
Kaito was laughing.
Ayane was reaching for a napkin.
It was unfinished, but the expressions were already recognizable.
Ayane stared at the page.
"You drew that just now?"
Mei nodded.
"I wanted to remember the afternoon."
Kaito leaned closer.
"You made my hair look better than it does in real life."
"Artistic license."
"You made Ayane's face look exactly the same."
"That's her natural expression."
Ayane kicked him beneath the table.
He yelped.
Hiro burst out laughing.
Mei carefully tore a spare sheet from the back of her sketchbook and handed it to Ayane.
"Here. You can keep this one when I finish it."
Ayane hesitated.
"Really?"
"Sure."
"Thank you."
Mei smiled.
"No problem."
It was a small thing.
A drawing.
Four people at a café.
Rain against the windows.
Nothing that anyone else would consider important.
But Ayane accepted it carefully, holding the paper by the edges.
She thought about the old blue book.
The notes written in its margins.
The years people had spent trying to say things they couldn't quite manage.
And she thought about how some moments became important only after they were over.
Outside, the rain began to fall harder.
Hiro looked out the window.
"We should go."
Mei closed her sketchbook.
"You're the one who forgot to check the weather."
"I checked."
"You looked at the sky for half a second."
"I gathered sufficient data."
"You're going to get wet."
Hiro stood and picked up his umbrella.
Mei took it from him before he could open it.
He stared.
"Again?"
"You hold it too high."
"I'm taller than you."
"That's not the problem."
"It's a little bit the problem."
She opened the umbrella.
He sighed and stepped beside her.
Then he reached for the handle.
They both held it.
Ayane watched them leave through the café window.
Kaito nudged her shoulder.
"What?"
She looked at him.
"Nothing."
He glanced at the drawing.
"You're keeping that, right?"
"Obviously."
"Good."
She slipped it carefully into her notebook.
Then she took out her phone.
She opened the folder where she'd kept the photograph of Tsubaki Books from 2021.
For a moment, she considered deleting it.
The mystery was over.
The people in the photograph had found each other.
There was no reason to keep collecting evidence.
Instead, she created a new folder.
#Things Worth Keeping.
She saved the photograph there.
Then the drawing Mei had given her.
Then a picture of the faded blue book, its cover resting beside the envelope signed by Yuzuna and Saki.
She stared at the folder for a moment.
Kaito leaned over.
"What's that?"
"Nothing."
He narrowed his eyes.
"Ayane."
She tilted the screen away.
"Don't look."
"You're making a folder, aren't you?"
"No."
"You're definitely making a folder."
She sighed.
"Fine. It's called Things Worth Keeping."
He went quiet.
Then he smiled.
"That's a good name."
She looked at him.
"Don't make it weird."
"I wasn't going to."
"Your face was."
He laughed.
She laughed too.
Across the street, the sign above Tsubaki Books swayed slightly in the wind.
Inside, a battered blue paperback sat beside an envelope with two names written on it.
The ending of _The House at the End of June_ remained unfair.
Its characters still made terrible decisions.
Its readers would probably continue arguing about it for years.
And somewhere in the margins, between a badly drawn fish and a tiny umbrella, a sentence remained.
!You said you'd tell me before you left.
Beside it was an answer.
!I should have.
Neither sentence had been erased.
Neither needed to be.
Because some things were worth keeping.
Some things were worth returning.
And some things, once finally understood, could be left exactly where they belonged.
Ayane reached for Kaito's hand beneath the table.
He held it.
Outside, the rain tapped gently against the windows.
No promises of forever.
No plans for the next five years.
Just a rainy afternoon, a terrible sandwich waiting to be eaten, and two people who had finally learned to ask the other to stay.
And somewhere down the street, Hiro was probably arguing with Mei about who should hold the umbrella.
Ayane smiled.
For now, that was enough.
*The End.`;
